rule_files:
- voice-roster-alerts.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: voice_platform_voice_roster_ws_observation_enabled{service_name="boohtacord-api"}
    values: 1+0x15
  - series: voice_platform_voice_roster_ws_subscribers{service_name="boohtacord-api"}
    values: 2+0x15
  - series: voice_platform_voice_roster_ws_last_success_timestamp_seconds{service_name="boohtacord-api"}
    values: 0+0x15
  alert_rule_test:
  - eval_time: 10m
    alertname: VoiceRosterInitialBlackout
    exp_alerts: []
  - eval_time: 10m
    alertname: VoiceRosterRefreshBlackout
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: Active roster watchers have no recent successful snapshot
        description: The 60-second budget is twelve 5-second refresh intervals, sustained
          for five minutes. Investigate dependencies, cancellation and WS delivery
          failures before rollback.
  - eval_time: 10m
    alertname: VoiceRosterTelemetryMissing
    exp_alerts: []
