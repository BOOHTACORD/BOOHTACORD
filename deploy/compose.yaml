name: voice-platform

x-json-log-rotation: &json-log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

include:
  - ./operators.yaml
  - ./livekit/compose.yaml

services:
  screen-preview-storage-init:
    image: busybox:1.37.0
    command: ["sh", "-ec", "mkdir -p /var/lib/voice-platform/screen-previews && chmod 0777 /var/lib/voice-platform/screen-previews"]
    volumes:
      - screen-previews-data:/var/lib/voice-platform/screen-previews
    networks: [private]
    restart: "no"

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_platform}
      POSTGRES_USER: ${POSTGRES_USER:-voice_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    logging: *json-log-rotation

  api:
    image: ${API_IMAGE:?set API_IMAGE to a pinned image reference in .env}
    deploy:
      replicas: 1
      update_config: {order: stop-first}
      rollback_config: {order: stop-first}
    environment:
      API_ADDR: :8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      DATABASE_URL: postgres://${POSTGRES_USER:-voice_platform}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-voice_platform}?sslmode=disable
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_PUBLIC_WS_URL: ${LIVEKIT_PUBLIC_WS_URL:?set LIVEKIT_PUBLIC_WS_URL in .env}
      LIVEKIT_PRIVATE_HTTP_URL: ${LIVEKIT_PRIVATE_HTTP_URL:-http://livekit:7880}
      ATTACHMENTS_DIRECTORY: /var/lib/voice-platform/attachments
      SCREEN_PREVIEW_DIRECTORY: /var/lib/voice-platform/screen-previews
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_INGEST_AUTH: ${OTEL_INGEST_AUTH:-}
      CLIENT_UPDATE_CATALOG_PATH: /etc/boohtacord/client-updates/catalog.json
      CLIENT_UPDATE_ALLOWED_HOSTS: ${PUBLIC_HOST:-localhost},github.com
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.254.2/32}
    depends_on:
      migrate:
        condition: service_completed_successfully
      screen-preview-storage-init:
        condition: service_completed_successfully
    volumes:
      - attachments-data:/var/lib/voice-platform/attachments
      - screen-previews-data:/var/lib/voice-platform/screen-previews
      - ./client-updates:/etc/boohtacord/client-updates:ro
    networks: [private, telemetry-egress]
    logging: *json-log-rotation

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to a pinned image reference in .env}
    networks: [private]
    logging: *json-log-rotation

  proxy:
    image: caddy:2.10.0-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api, web]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge: {}
      private:
        ipv4_address: ${PRIVATE_PROXY_IP:-172.30.254.2}
    logging: *json-log-rotation

networks:
  edge:
  telemetry-egress:
  private:
    internal: true
    ipam:
      config:
        - subnet: ${PRIVATE_NETWORK_SUBNET:-172.30.254.0/24}
  livekit-metrics:
    internal: true

volumes:
  postgres-data:
  attachments-data:
  screen-previews-data:
  caddy-data:
  caddy-config:
