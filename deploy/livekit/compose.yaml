x-json-log-rotation: &json-log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]
    logging: *json-log-rotation

  livekit:
    image: livekit/livekit-server:v1.13.7
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        awk '
          BEGIN {
            key = ENVIRON["LIVEKIT_API_KEY"]
            secret = ENVIRON["LIVEKIT_API_SECRET"]
            if (key == "" || secret == "") exit 1
          }
          $0 == "  __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__" {
            print "  " key ": " secret
            replaced = 1
            next
          }
          $0 == "  api_key: __LIVEKIT_API_KEY__" {
            print "  api_key: " key
            next
          }
          { print }
          END { if (!replaced) exit 1 }
        ' /etc/livekit-template.yaml > /tmp/livekit.yaml
        exec /livekit-server --config /tmp/livekit.yaml --node-ip "$${LIVEKIT_NODE_IP}"
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP in .env}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7882:7882/tcp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit-template.yaml:ro
    networks:
      livekit-rtc: {}
      private:
        aliases: [livekit]
      livekit-metrics: {}
    logging: *json-log-rotation

  egress:
    image: livekit/egress:v1.14.1
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      screen-preview-storage-init:
        condition: service_completed_successfully
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - screen-previews-data:/var/lib/voice-platform/screen-previews
    networks: [private, telemetry-egress]
    restart: unless-stopped
    logging: *json-log-rotation
