name: Native master quality

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-master-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.repository == 'BOOHTACORD/BOOHTACORD' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.select.outputs.contracts }}
      map_version: ${{ steps.select.outputs.map_version }}
      map_sha256: ${{ steps.select.outputs.map_sha256 }}
      uncertain: ${{ steps.select.outputs.uncertain }}
      backend: ${{ steps.select.outputs.backend }}
      web: ${{ steps.select.outputs.web }}
      flutter: ${{ steps.select.outputs.flutter }}
      windows: ${{ steps.select.outputs.windows }}
      server: ${{ steps.select.outputs.server }}
      server_release_impact: ${{ steps.select.outputs.server_release_impact }}
      native_release_impact: ${{ steps.select.outputs.native_release_impact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - id: select
        run: python3 -m tools.ci.select_changes.run

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    uses: ./.github/workflows/ci-flutter.yaml

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/flutter-windows.yaml

  native-required:
    if: always()
    needs: [changes, flutter, windows]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Require exact-master native quality
        env:
          MASTER_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m tools.ci.master_quality.run native
      - name: Retain source-bound master quality result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-master-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/master-native.json
          if-no-files-found: error
          retention-days: 30
      - name: Explain required-check outcome with source-bound sanitized metadata
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIAGE_NEEDS: ${{ toJSON(needs) }}
          CI_GATE_OUTCOME: ${{ job.status }}
        run: python -m tools.ci.observability.summary --scope native
      - name: Retain sanitized required-check triage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/triage/native.json
          if-no-files-found: error
          retention-days: 30

