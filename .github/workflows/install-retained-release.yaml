name: Install retained release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful master Build server run ID
        required: true
        type: string
      revision:
        description: Exact full source revision from that build
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: v-bootybay-production
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      SSH_USER: shaneque
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Install exact trusted retained bundle
        uses: ./.github/actions/install-trusted-server
        with:
          mode: retained
          build-run-id: ${{ inputs.build_run_id }}
          revision: ${{ inputs.revision }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
