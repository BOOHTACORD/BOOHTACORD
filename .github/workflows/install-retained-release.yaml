name: Install retained release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful master Build server run ID
        required: true
        type: string
      revision:
        description: Exact full source revision from that build
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: v-bootybay-production
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      SSH_USER: shaneque
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - id: producer
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m tools.release.delivery.provenance
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ steps.producer.outputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.producer.outputs.artifact_name }}
          path: .out/incoming
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: bash tools/release/ssh/configure-deploy-ssh.sh
      - env:
          RELEASE_REVISION: ${{ steps.producer.outputs.revision }}
          BUNDLE_DIRECTORY: .out/incoming
        run: bash tools/release/delivery/transfer.sh
