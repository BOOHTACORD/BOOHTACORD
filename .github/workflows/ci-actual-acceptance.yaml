name: Risk-based actual acceptance

on:
  workflow_call:
    inputs:
      profiles:
        type: string
        required: true

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profiles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Node SDK and locked dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .out/ci/cache-inputs/npm.json
      - name: Prepare public Go SDK and dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: .out/ci/cache-inputs/go.json
      - name: Install locked real browser
        working-directory: clients/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install window manager for real visibility transitions
        if: matrix.profile == 'next'
        run: sudo apt-get update && sudo apt-get install -y openbox x11-utils
      - name: Run original controllers in one disposable VM namespace
        env:
          ACTUAL_PROFILE: ${{ matrix.profile }}
          BASELINE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: python -m tools.ci.actual_acceptance.run --profile "$ACTUAL_PROFILE" --baseline "$BASELINE_REVISION"
      - name: Retain finite public results and synthetic captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actual-${{ matrix.profile }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/actual-acceptance/public/
          if-no-files-found: error
          retention-days: 30

  actual-acceptance:
    if: always()
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: actual-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: .out/actual-download
      - name: Require every selected actual runtime and its cleanup
        env:
          ACTUAL_PROFILES: ${{ inputs.profiles }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          python -m tools.ci.actual_acceptance.fan_in --profiles "$ACTUAL_PROFILES"
