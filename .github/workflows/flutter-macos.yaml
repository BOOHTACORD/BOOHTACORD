name: Flutter macOS CI

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Also build the native universal app on a disposable hosted Mac
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Verify fast metadata and packaging regressions
        run: python -m tools.ci.macos.fast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-fast-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/macos-fast.json
          if-no-files-found: error
          retention-days: 30

  macos:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master' && inputs.full_build
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Require reviewed native Apple host before SDK restoration
        run: python -m tools.ci.macos.host --arch arm64
      - uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get --enforce-lockfile
      - name: Require platform-only vendor tests before native build
        run: python3 -m tools.verify.macos_unit.run
      - name: Retain macOS vendor test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-unit-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/checks/macos-unit/
          if-no-files-found: error
          retention-days: 30
      - name: Build universal macOS release client
        run: python3 -m tools.build.macos.run
      - name: Package macOS CI build and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -E -n 's/^version: *([0-9][0-9.]*)\+[0-9][0-9]*$/\1/p' clients/flutter/pubspec.yaml)"
          test -n "$version"
          bash tools/build/macos/package.sh \
            clients/flutter/build/macos/Build/Products/Release/BOOHTACORD.app \
            "macos-v$version" \
            "$RUNNER_TEMP/boohtacord-macos-artifacts"
      - name: Inspect native identity and retain distribution manifest
        run: python3 -m tools.build.macos.metadata clients/flutter/build/macos/Build/Products/Release/BOOHTACORD.app "$RUNNER_TEMP/boohtacord-macos-artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOOHTACORD-macos-universal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boohtacord-macos-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-host-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/macos-host.json
          if-no-files-found: error
          retention-days: 30
