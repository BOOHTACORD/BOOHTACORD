name: Flutter macOS CI

# GitHub manual build while the macOS self-hosted runner is being migrated.

# Keep manual dispatch until a GitHub macOS runner is provisioned.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Verify Flutter toolchain
        run: flutter --version
      - name: Cache patched macOS WebRTC SDK
        id: webrtc-sdk-cache
        uses: actions/cache@v4
        with:
          path: clients/flutter/packages/flutter_webrtc/macos/flutter_webrtc/Binary/
          key: webrtc-macos-${{ runner.arch }}-${{ hashFiles('clients/flutter/packages/flutter_webrtc/third_party/apple-sdk.json', 'clients/flutter/packages/flutter_webrtc/third_party/patches/webrtc-sdk-*.patch', 'tools/build/webrtc_sdk/build_macos.py') }}
      - name: Build patched macOS WebRTC SDK
        if: steps.webrtc-sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/build/webrtc_sdk/build_macos.py --test
      - name: Verify installed WebRTC SDK
        run: python3 tools/build/webrtc_sdk/build_macos.py --verify
      - name: Resolve locked Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get --enforce-lockfile
      - name: Test macOS release packaging
        run: bash tools/build/macos/package.test.sh
      - name: Run Flutter tests
        working-directory: clients/flutter
        run: flutter test
      - name: Analyze Flutter client
        working-directory: clients/flutter
        run: flutter analyze --no-fatal-infos
      - name: Build universal macOS release client
        working-directory: clients/flutter
        run: flutter build macos --release --no-pub
      - name: Package macOS CI build and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -E -n 's/^version: *([0-9][0-9.]*)\+[0-9][0-9]*$/\1/p' clients/flutter/pubspec.yaml)"
          test -n "$version"
          bash tools/build/macos/package.sh \
            clients/flutter/build/macos/Build/Products/Release/BOOHTACORD.app \
            "macos-v$version" \
            "$RUNNER_TEMP/boohtacord-macos-artifacts"
      - name: Inspect native identity and retain distribution manifest
        run: python3 -m tools.build.macos.metadata clients/flutter/build/macos/Build/Products/Release/BOOHTACORD.app "$RUNNER_TEMP/boohtacord-macos-artifacts"
      - name: Retain macOS build and checksum as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOOHTACORD-macos-universal-${{ github.sha }}
          path: ${{ runner.temp }}/boohtacord-macos-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
