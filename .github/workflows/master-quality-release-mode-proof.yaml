name: Master quality release-mode proof
on:
  pull_request:
    branches: [codex/issue393-master-receipts]
permissions:
  contents: read
  actions: read
jobs:
  contracts:
    uses: ./.github/workflows/ci-contracts.yaml
    with:
      release_receipt: true
  provenance-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Check actual producer metadata without downloading or installing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          from tools.release.delivery.provenance import main
          source = '74197bec5951e672bb2daae85ab7a234ffffe545'
          cases = []
          with tempfile.TemporaryDirectory() as tmp:
              output = Path(tmp) / 'outputs'
              os.environ.update(BUILD_RUN_ID='39237355984', REQUESTED_REVISION=source, GITHUB_OUTPUT=str(output))
              main()
              values = dict(line.split('=', 1) for line in output.read_text().splitlines())
              assert values['revision'] == source and values['run_id'] == '39237355984'
              assert values['artifact_name'] == 'server-' + source
              cases.append({'case':'actual-legacy-producer', 'run_id':39237355984, 'status':'PASS'})
              for label, run_id, requested, expected in (
                  ('actual-pr-producer', '39240295548', '', 'Unexpected producer workflow'),
                  ('actual-cancelled-master', '39230709932', '', 'Build is incomplete'),
                  ('actual-stale-source', '39237355984', '1aea1469164ff4365c9eaa3b4d13e69054fc38da', 'Requested revision differs from build')):
                  output.unlink(missing_ok=True)
                  os.environ.update(BUILD_RUN_ID=run_id, REQUESTED_REVISION=requested)
                  try:
                      main()
                  except ValueError as error:
                      assert str(error) == expected
                  else:
                      raise AssertionError('Untrusted producer was accepted')
                  assert not output.exists()
                  cases.append({'case':label, 'run_id':int(run_id), 'status':'EXPECTED_REJECTION'})
          result = {'status':'PASS', 'qa_source_revision':os.environ['GITHUB_SHA'], 'cases':cases,
                    'scope':'Actual read-only API metadata and download-output preflight only; no bundle download, signing or installation'}
          path = Path('.out/issue393-provenance-proof.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, sort_keys=True) + '\n')
          print('PASS: real legacy compatibility and PR/cancelled/stale producer rejection')
          PY
      - name: Retain public producer boundary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: master-provenance-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/issue393-provenance-proof.json
          if-no-files-found: error
          retention-days: 30
