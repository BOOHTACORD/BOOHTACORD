name: Sample active attachment uploads

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the plan and emit NOT_RUN without host access
        type: boolean
        default: true
      expected_source:
        description: Exact 40-character currently deployed source (not necessarily latest master)
        type: string
        required: true
      operator_ready:
        description: A controlled upload is ready and will finish during sampling
        type: choice
        options: [not-ready, upload-in-progress]
        default: not-ready
      sample_count:
        description: Bounded read-only samples (2 to 120)
        type: string
        default: '90'

permissions:
  contents: read
  actions: read

jobs:
  sample:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production-diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: v-bootybay-operator-diagnostics
      cancel-in-progress: false
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      SSH_USER: boohtacord-diag
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      OPERATOR_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      OPERATOR_CONFIRM: ${{ inputs.operator_ready }}
      QA08_SAMPLE_COUNT: ${{ inputs.sample_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Validate authenticated approval and execute the fixed operator capability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATOR_SSH_PRIVATE_KEY: ${{ secrets.OPERATOR_DIAGNOSTIC_SSH_KEY }}
        run: python -m tools.ops.operator.run sample
      - name: Retain sanitized operator audit receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-sample-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/operator/sample/receipt.json
          if-no-files-found: error
          retention-days: 30
