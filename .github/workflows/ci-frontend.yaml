name: CI frontend

on:
  workflow_call:
    inputs:
      release_receipt:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    env:
      VITE_PUBLIC_ORIGIN: https://v.bootybay.ru
    steps:
      - uses: actions/checkout@v4
      - name: Test review-only UI/UX screenshot region deltas
        run: python3 -m unittest tools.verify.test_uiux_visual_diff tools.verify.test_uiux_visual_matrix
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Install locked browser runtime
        working-directory: clients/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test and build Vue client
        run: python3 -m tools.ci.receipts.run web
      - name: Retain UX responsive-shell review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-responsive-shell-${{ github.sha }}
          path: .out/responsive-shell-browser-results/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain synthetic Web control and browser zoom captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-controls-${{ github.sha }}
          path: .out/issue342/browser/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain synthetic microcopy inventory and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-microcopy-${{ github.sha }}
          path: .out/issue343/browser/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain synthetic navigation density and browser zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-navigation-${{ github.sha }}
          path: .out/issue344/browser/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain search mode and DM picker actual browser zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-search-dm-picker-${{ github.sha }}
          path: |
            .out/qa294-search-session-browser/**
            .out/dw02-dm-starter/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain compact search and related result surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-search-presentation-${{ github.sha }}
          path: .out/issue346/browser/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain settings hierarchy and browser zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-settings-density-${{ github.sha }}
          path: .out/issue351/browser/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain compact voice controls and browser zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-voice-interface-${{ github.sha }}
          path: .out/issue347/browser/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain synthetic TEXT and DM rhythm and browser zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-chat-rhythm-${{ github.sha }}
          path: .out/issue345/browser/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain sanitized real-SFU screen-share smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-share-sfu-smoke-${{ github.sha }}
          path: .out/screen-profile-browser-results/**/screen-share-sfu-smoke.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain anonymous restricted-network measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restricted-networks-${{ github.sha }}
          path: .out/restricted-networks/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain source-bound gate receipt
        if: inputs.release_receipt
        uses: actions/upload-artifact@v4
        with:
          name: check-web-${{ github.sha }}
          path: .out/checks/web.json
          if-no-files-found: error
          retention-days: 30
