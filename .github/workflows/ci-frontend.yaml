name: CI frontend

on:
  workflow_call:
    inputs:
      release_receipt:
        type: boolean
        default: false
      evidence_namespace:
        type: string
        default: web

permissions:
  contents: read

env:
  VITE_PUBLIC_ORIGIN: https://v.bootybay.ru
  WEB_NAMESPACE: ${{ inputs.evidence_namespace }}

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Node SDK and locked dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .out/ci/cache-inputs/npm.json
      - name: Run complete reviewed fast profile
        run: python3 -m tools.ci.web_suites.run --profile fast
      - name: Retain mandatory source-bound profile result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-part-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-fast
          path: .out/ci/web-parts/fast.json
          if-no-files-found: error
          retention-days: 30

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [browser-shell, browser-content, browser-conversations, browser-voice]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Node SDK and locked dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .out/ci/cache-inputs/npm.json
      - name: Require fresh synthetic browser capture outputs
        env:
          WEB_PROFILE: ${{ matrix.profile }}
        run: python3 -m tools.ci.artifact_policy.run begin web "$WEB_PROFILE"
      - name: Run complete reviewed browser profile
        env:
          WEB_PROFILE: ${{ matrix.profile }}
        run: python3 -m tools.ci.web_suites.run --profile "$WEB_PROFILE"
      - name: Retain mandatory source-bound profile result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-part-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          path: .out/ci/web-parts/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Package verified synthetic browser captures
        if: always()
        env:
          WEB_PROFILE: ${{ matrix.profile }}
          CAPTURE_UPSTREAM_STATUS: ${{ job.status }}
        run: python3 -m tools.ci.artifact_policy.run finish web "$WEB_PROFILE"
      - name: Retain verified synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-visual-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          path: .out/ci/capture-packages/web-${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && job.status == 'success' && 7 || 30 }}

  sfu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Node SDK and locked dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .out/ci/cache-inputs/npm.json
      - name: Run complete reviewed sfu profile
        run: python3 -m tools.ci.web_suites.run --profile sfu-network
      - name: Retain mandatory source-bound profile result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-part-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-sfu-network
          path: .out/ci/web-parts/sfu-network.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain original sanitized browser and SFU evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-sfu-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-sfu-network
          path: |
            .out/screen-profile-browser-results/**/screen-share-sfu-smoke.json
            .out/restricted-networks/*.json
          if-no-files-found: ignore
          retention-days: 30

  frontend:
    if: always()
    needs: [fast, browser, sfu]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Download only this execution's complete profile result set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: web-part-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .out/ci/web-parts
          merge-multiple: true
      - name: Require successful jobs and all exact-source profiles before the Web receipt
        env:
          WEB_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m tools.ci.receipts.run web --parts .out/ci/web-parts
      - name: Retain source-bound Web fan-in summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-fan-in-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/web-fan-in.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain source-bound gate receipt
        if: inputs.release_receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/checks/web.json
          if-no-files-found: error
          retention-days: 30
