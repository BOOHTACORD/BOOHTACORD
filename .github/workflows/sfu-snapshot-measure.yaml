name: Actual SFU snapshot measurement

on:
  pull_request:
    paths:
      - backend/internal/media/**
      - backend/internal/app/media_routes/**
      - backend/internal/observability/http_metrics/**
      - tools/qa/sfu_snapshot_measure/**
      - .github/workflows/sfu-snapshot-measure.yaml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Go SDK and dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: .out/ci/cache-inputs/go.json
      - name: Test owned executable identity guards
        run: python3 -m unittest tools.qa.sfu_snapshot_measure.test_identity
      - name: Measure real private RoomService fan-out
        run: python3 -m tools.qa.sfu_snapshot_measure.run --expect-reduction
      - name: Retain bounded source-bound measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sfu-snapshot-measure-${{ github.sha }}
          path: .out/sfu-snapshot-measure/report.json
          if-no-files-found: ignore
          retention-days: 30
