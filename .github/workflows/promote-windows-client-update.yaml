name: Promote Windows client update

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable Windows release tag, for example windows-v1.0.39
        required: true
        type: string
      expected_catalog_revision:
        description: Current deploy/client-updates/catalog.json revision
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: windows-client-update-promotion
  cancel-in-progress: false

jobs:
  push-candidate:
    permissions:
      contents: write
      pull-requests: read
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      branch: ${{ steps.candidate.outputs.branch }}
      intent_id: ${{ steps.candidate.outputs.intent_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Download published release metadata and immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^windows-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Use a stable tag in the form windows-vMAJOR.MINOR.PATCH."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/windows-release"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/windows-release/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "BOOHTACORD-${RELEASE_TAG}-x64.zip" \
            --pattern artifact-manifest.json --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/windows-release"
      - name: Verify release, preserve selectors and push or reuse only the exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_REVISION: ${{ inputs.expected_catalog_revision }}
        run: python -m tools.release.windows_promotion.prepare
      - name: Retain public promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-promotion-input-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/windows-promotion/
          if-no-files-found: error
          retention-days: 30

  candidate-ci:
    needs: push-candidate
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master' && needs.push-candidate.outputs.changed == 'true'
    environment: production
    permissions:
      contents: read
      actions: write
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-promotion-input-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/windows-promotion/
      - name: Require a new full CI execution on the exact candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ needs.push-candidate.outputs.branch }}
          CANDIDATE_SHA: ${{ needs.push-candidate.outputs.candidate_sha }}
        run: |
          python -m tools.release.client_updates.candidate_ci \
            --branch "$CANDIDATE_BRANCH" --sha "$CANDIDATE_SHA" --repository "$GITHUB_REPOSITORY" \
            --fresh --report .out/windows-promotion/ci.json
      - name: Retain public promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-promotion-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/windows-promotion/
          if-no-files-found: error
          retention-days: 30

  prepare-catalog-pr:
    needs: [push-candidate, candidate-ci]
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master' && needs.push-candidate.outputs.changed == 'true'
    environment: production
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-promotion-input-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/windows-promotion/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-promotion-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/windows-promotion/
      - name: Recheck source catalog, branch and exact successful CI before review PR
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.push-candidate.outputs.candidate_sha }}
        run: python -m tools.release.windows_promotion.review
      - name: Retain public promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-promotion-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/windows-promotion/
          if-no-files-found: error
          retention-days: 30
