name: Promote Windows client update

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable Windows release tag, for example windows-v1.0.39
        required: true
        type: string
      expected_catalog_revision:
        description: Current deploy/client-updates/catalog.json revision
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: windows-client-update-promotion
  cancel-in-progress: false

jobs:
  prepare-catalog-pr:
    permissions:
      contents: write
      actions: write
      pull-requests: write
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - name: Require dispatch from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Run this promotion workflow from master."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: master
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download published release metadata and immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^windows-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Use a stable tag in the form windows-vMAJOR.MINOR.PATCH."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/windows-release"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/windows-release/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "BOOHTACORD-${RELEASE_TAG}-x64.zip" \
            --pattern artifact-manifest.json --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/windows-release"
      - name: Verify release and prepare guarded catalog candidate
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_REVISION: ${{ inputs.expected_catalog_revision }}
        run: |
          python -m tools.release.client_updates.promote_windows_release \
            --catalog deploy/client-updates/catalog.json \
            --expected-revision "$EXPECTED_REVISION" \
            --release "$RUNNER_TEMP/windows-release/release.json" \
            --archive "$RUNNER_TEMP/windows-release/BOOHTACORD-${RELEASE_TAG}-x64.zip" \
            --manifest "$RUNNER_TEMP/windows-release/artifact-manifest.json" \
            --checksums "$RUNNER_TEMP/windows-release/SHA256SUMS" \
            --repository "$GITHUB_REPOSITORY"
          python -m tools.release.client_updates.catalog validate \
            --path deploy/client-updates/catalog.json
          git diff --check
          if git diff --quiet -- deploy/client-updates/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned catalog test runner
        run: python -m pip install pytest==8.4.2
      - name: Test candidate before creating a review branch
        run: |
          python -m pytest -q tools/release/client_updates/test_catalog.py \
            tools/release/client_updates/test_windows_promotion.py \
            tools/release/client_updates/test_windows_promotion_security.py \
            tools/release/client_updates/test_candidate_ci.py
          python -m tools.release.client_updates.catalog validate \
            --path deploy/client-updates/catalog.json
          git diff --check
      - name: Run full CI on candidate before opening pull request
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          branch="codex/windows-catalog-${RELEASE_TAG}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- deploy/client-updates/catalog.json
          git commit -m "chore(updates): prepare $RELEASE_TAG catalog promotion"
          git push --set-upstream origin "$branch"
          candidate_sha="$(git rev-parse HEAD)"
          ci_run_url="$(python -m tools.release.client_updates.candidate_ci \
            --branch "$branch" --sha "$candidate_sha" --repository "$GITHUB_REPOSITORY")"
          body_file="$RUNNER_TEMP/promotion-pr.md"
          cat > "$body_file" <<EOF
          This candidate was created by an explicit workflow dispatch for `$RELEASE_TAG`.

          The published release metadata, Windows x64 archive, embedded file inventory, and SHA-256 checksums were verified. The catalog update was applied with the requested expected-revision guard and only changes the Windows/direct/stable/x64 selector.

          Full CI passed on the exact candidate commit before this PR was opened: $ci_run_url

          Review this PR before merging. This workflow_dispatch run is candidate evidence and may not satisfy the repository's required PR checks. Confirm the PR checks are successful; GitHub may require a writer to approve pull_request workflows created by GITHUB_TOKEN. Merge triggers the normal signed server build/deploy pipeline. Production endpoint readback and installed-old-client acceptance remain separate gates.
          EOF
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" \
            --title "Review Windows update promotion: $RELEASE_TAG" --body-file "$body_file"; then
            echo "::error::Catalog branch was pushed but the PR was not created. If Actions PR creation is disabled, enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests; otherwise inspect the gh error and open the branch PR manually. Master was not changed."
            exit 1
          fi
