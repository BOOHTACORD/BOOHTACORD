name: CI contracts

on:
  workflow_call:
    inputs:
      release_receipt:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Go SDK and dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: .out/ci/cache-inputs/go.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Test shared immutable native release publication
        run: node --test tools/release/native_contract/publish.test.mjs
      - name: Test bounded restricted-network evidence readiness
        run: node --test tools/network/restricted/measurement.test.mjs
      - name: Install pinned CI verification dependencies
        run: python -m pip install -r tools/requirements-ci.txt -r tools/verify/openapi_parity/requirements.txt
      - name: Verify reviewed Actions pins, least privilege and source trust
        run: |
          python3 -m unittest tools.verify.action_pins.test_policy tools.verify.action_pins.test_local tools.verify.action_pins.test_trust tools.verify.action_pins.test_lint
          python3 -m tools.verify.action_pins.run
          python3 -m tools.verify.action_pins.lint
      - name: Verify SDK cache invalidation and unconditional checks
        run: |
          python3 -m unittest tools.ci.toolchains.test_cache_inputs tools.ci.toolchains.test_workflows tools.ci.flutter_setup.test_metadata tools.ci.flutter_setup.test_run tools.ci.flutter_setup.test_workflow
          python3 -m tools.ci.toolchains.workflows
          python3 -m tools.ci.toolchains.auxiliary
      - name: Verify generated tracing contract bindings
        run: node tools/observability/flow_contract/generate.mjs --check
      - name: Verify publisher signatures and desktop promotion guards
        run: python3 -m unittest tools.release.desktop_updates.test_signing tools.verify.action_pins.test_release_boundary
      - name: Test stable required gate success and failure semantics
        run: python3 -m unittest tools.ci.required_gate.test_validation tools.ci.required_gate.test_run
      - name: Verify migration control matrix, evidence readiness and configuration rollback safety
        run: python -m unittest tools.ci.migration.test_readiness tools.ci.migration.test_rollback tools.ci.migration.test_controls tools.ci.migration.test_receipts tools.ci.migration.test_workflow
      - name: Verify failure triage privacy, source binding and bounded infra-only retry
        run: python -m unittest tools.ci.observability.test_triage tools.ci.observability.test_network tools.ci.observability.test_summary tools.ci.observability.test_report tools.ci.observability.test_workflow tools.ci.observability.test_alerts
      - name: Verify fast macOS metadata, pinned SDK ABI and immutable publisher
        run: |
          python -m tools.ci.macos.fast
          node --test tools/build/webrtc_macos/publish.test.mjs
      - name: Verify risk routing, real-runtime evidence and cleanup guards
        run: python -m unittest tools.ci.actual_acceptance.test_plan tools.ci.actual_acceptance.test_session tools.ci.actual_acceptance.test_validation tools.ci.actual_acceptance.test_fan_in tools.ci.actual_acceptance.test_manual_inputs tools.ci.actual_acceptance.test_workflow tools.ci.actual_acceptance.test_run tools.qa.compatible_rollback.test_receipt_projection
      - name: Verify manual operator capabilities, approvals and audit privacy
        run: python -m unittest tools.ops.operator.test_policy tools.ops.operator.test_approval tools.ops.operator.test_run tools.ops.operator.test_transport tools.ops.operator.test_workflow tools.ops.operator.test_remote tools.ops.operator.test_operations
      - name: Verify unified fail-closed CI and release routing
        run: python3 -m unittest tools.ci.select_changes.test_selection tools.ci.select_changes.test_routing tools.ci.select_changes.test_diff tools.release.delivery.test_routing tools.release.delivery.test_workflows
      - name: Test read-only CI baseline collection and statistics
        run: python3 -m unittest tools.ci.baseline.test_metrics tools.ci.baseline.test_normalize tools.ci.baseline.test_collect tools.ci.baseline.test_report
      - name: Verify trusted server builder source and TCP readiness
        run: python3 -m unittest tools.build.server.test_smoke_readiness tools.build.server.test_runtime_inputs tools.build.server.test_social_preview tools.build.server.test_image_audio_flag
      - name: Reject stale or rewritten Windows promotion intents in the actual test merge
        run: python3 -m tools.release.windows_promotion.check_source
      - name: Verify API and requirement traceability
        shell: pwsh
        run: |
          python -m tools.ci.receipts.run contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Compose interpolation without starting services
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
      - name: Verify private OTLP egress wiring
        shell: pwsh
        run: ./tools/verify/otel_egress/verify-otel-egress.ps1
      - name: Verify trace dashboard correlation
        run: python3 -m unittest tools.verify.trace_dashboard.test_traces_dashboard tools.verify.trace_dashboard.test_flow_dashboard
      - name: Verify media QoE dashboard and rule semantics
        run: |
          python3 -m unittest tools.verify.media_qoe.test_dashboard
          python3 -m tools.verify.media_qoe.promql .out/media-qoe
          docker run --rm --entrypoint promtool -v "$PWD:/work" -w /work prom/prometheus:v3.11.2 check rules docker/observability/media-qoe-alerts.yaml .out/media-qoe/dashboard-rules.yaml
          docker run --rm --entrypoint promtool -v "$PWD:/work" -w /work prom/prometheus:v3.11.2 test rules tools/verify/media_qoe/alerts.test.yaml tools/verify/media_qoe/diagnostics.test.yaml .out/media-qoe/dashboard.test.yaml
      - name: Verify roster dashboard and sustained alert semantics
        run: |
          python3 -m tools.verify.voice_roster_observability.promql
          docker run --rm --entrypoint promtool -v "$PWD:/work" -w /work prom/prometheus:v3.11.2 check rules docker/observability/voice-roster-alerts.yaml .out/voice-roster/dashboard-rules.yaml
          docker run --rm --entrypoint promtool -v "$PWD:/work" -w /work/.out/voice-roster prom/prometheus:v3.11.2 test rules idle.yaml initial_blackout.yaml refresh_blackout.yaml telemetry_missing.yaml
      - name: Verify paired screen acceptance evidence gate
        run: |
          python3 -m unittest tools.verify.paired_screen_acceptance.test_evidence
          python3 -m tools.verify.paired_screen_acceptance.validate_evidence evidence/media/issue-173-paired-acceptance-2026-10-07.json
      - name: Reject implicit or latest Compose images
        shell: pwsh
        run: ./tools/verify/compose_images/verify-compose-images.ps1
      - name: Test proxy network deployment guard
        run: bash tools/release/rollout/deploy-images.test.sh
      - name: Test all negative release boundaries in ordinary CI
        if: ${{ !inputs.release_receipt }}
        run: bash tools/ci/release_guards/test-negative-boundaries.sh
      - name: Verify all deployment guard failures before producing a release receipt
        if: inputs.release_receipt
        run: bash tools/ci/release_guards/verify-release-guards.sh
      - name: Retain source-bound gate receipt
        if: inputs.release_receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/checks/contracts.json
          if-no-files-found: error
          retention-days: 30
