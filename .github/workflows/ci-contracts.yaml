name: CI contracts

on:
  workflow_call:
    inputs:
      release_receipt:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test bounded restricted-network evidence readiness
        run: node --test tools/network/restricted/measurement.test.mjs
      - name: Verify generated tracing contract bindings
        run: node tools/observability/flow_contract/generate.mjs --check
      - name: Install pinned CI verification dependencies
        run: python -m pip install -r tools/requirements-ci.txt -r tools/verify/openapi_parity/requirements.txt
      - name: Verify publisher signatures and desktop promotion guards
        run: python3 -m unittest tools.release.desktop_updates.test_signing
      - name: Test stable required gate success and failure semantics
        run: python3 -m unittest tools.ci.required_gate.test_validation tools.ci.required_gate.test_run
      - name: Verify unified fail-closed CI and release routing
        run: python3 -m unittest tools.ci.select_changes.test_selection tools.ci.select_changes.test_routing tools.ci.select_changes.test_diff tools.release.delivery.test_routing tools.release.delivery.test_workflows
      - name: Test read-only CI baseline collection and statistics
        run: python3 -m unittest tools.ci.baseline.test_metrics tools.ci.baseline.test_normalize tools.ci.baseline.test_collect tools.ci.baseline.test_report
      - name: Verify trusted server builder source and TCP readiness
        run: python3 -m unittest tools.build.server.test_smoke_readiness tools.build.server.test_runtime_inputs tools.build.server.test_social_preview tools.build.server.test_image_audio_flag
      - name: Verify API and requirement traceability
        shell: pwsh
        run: |
          python -m tools.ci.receipts.run contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Compose interpolation without starting services
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
      - name: Verify private OTLP egress wiring
        shell: pwsh
        run: ./tools/verify/otel_egress/verify-otel-egress.ps1
      - name: Verify trace dashboard correlation
        run: python3 -m unittest tools.verify.trace_dashboard.test_traces_dashboard tools.verify.trace_dashboard.test_flow_dashboard
      - name: Verify media QoE dashboard and rule semantics
        run: |
          python3 -m unittest tools.verify.media_qoe.test_dashboard
          python3 -m tools.verify.media_qoe.promql .out/media-qoe
          docker run --rm --entrypoint promtool -v "$PWD:/work" -w /work prom/prometheus:v3.11.2 check rules docker/observability/media-qoe-alerts.yaml .out/media-qoe/dashboard-rules.yaml
          docker run --rm --entrypoint promtool -v "$PWD:/work" -w /work prom/prometheus:v3.11.2 test rules tools/verify/media_qoe/alerts.test.yaml tools/verify/media_qoe/diagnostics.test.yaml .out/media-qoe/dashboard.test.yaml
      - name: Verify roster dashboard and sustained alert semantics
        run: |
          python3 -m tools.verify.voice_roster_observability.promql
          docker run --rm --entrypoint promtool -v "$PWD:/work" -w /work prom/prometheus:v3.11.2 check rules docker/observability/voice-roster-alerts.yaml .out/voice-roster/dashboard-rules.yaml
          docker run --rm --entrypoint promtool -v "$PWD:/work" -w /work/.out/voice-roster prom/prometheus:v3.11.2 test rules idle.yaml initial_blackout.yaml refresh_blackout.yaml telemetry_missing.yaml
      - name: Verify paired screen acceptance evidence gate
        run: |
          python3 -m unittest tools.verify.paired_screen_acceptance.test_evidence
          python3 -m tools.verify.paired_screen_acceptance.validate_evidence evidence/media/issue-173-paired-acceptance-2026-10-07.json
      - name: Reject implicit or latest Compose images
        shell: pwsh
        run: ./tools/verify/compose_images/verify-compose-images.ps1
      - name: Test proxy network deployment guard
        run: bash tools/release/rollout/deploy-images.test.sh
      - name: Verify all deployment guard failures before producing a release receipt
        if: inputs.release_receipt
        run: bash tools/ci/release_guards/verify-release-guards.sh
      - name: Retain source-bound gate receipt
        if: inputs.release_receipt
        uses: actions/upload-artifact@v4
        with:
          name: check-contracts-${{ github.sha }}
          path: .out/checks/contracts.json
          if-no-files-found: error
          retention-days: 30
