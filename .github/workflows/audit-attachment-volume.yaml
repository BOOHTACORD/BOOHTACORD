name: Audit attachment volume

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the plan and emit NOT_RUN without host access
        type: boolean
        default: true
      expected_source:
        description: Exact 40-character currently deployed source (not necessarily latest master)
        type: string
        required: true
      confirm:
        description: Explicitly authorize read-only observation
        type: choice
        options: [not-ready, read-only-observation]
        default: not-ready

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production-diagnostics
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 5
    concurrency:
      group: v-bootybay-operator-diagnostics
      cancel-in-progress: false
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      SSH_USER: boohtacord-diag
      EXPECTED_SOURCE: ${{ inputs.expected_source }}
      OPERATOR_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      OPERATOR_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Validate authenticated approval and execute the fixed operator capability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATOR_SSH_PRIVATE_KEY: ${{ secrets.OPERATOR_DIAGNOSTIC_SSH_KEY }}
        run: python -m tools.ops.operator.run audit
      - name: Retain sanitized operator audit receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/operator/audit/receipt.json
          if-no-files-found: error
          retention-days: 30
