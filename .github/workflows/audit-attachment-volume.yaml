name: Audit attachment volume

# GitHub Actions operator workflow; run only from master.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_USER: shaneque
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure pinned read-only SSH transport
        shell: bash
        run: bash tools/release/ssh/configure-deploy-ssh.sh
      - name: Measure exact volume and running API without mutation
        shell: bash
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          [[ "$git_sha" =~ ^[0-9a-f]{40}$ ]]
          remote="${SSH_USER}@${DEPLOY_SERVER_IP}"
          ssh_options=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$git_sha" < tools/ops/attachment_audit/audit-attachment-volume.sh
