name: Read-only CI triage

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact workflow run ID in this repository
        type: string
        required: true
      source_revision:
        description: Exact API head SHA for that run (not an inferred tested PR merge)
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Inspect only authenticated run and job metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVED_RUN_ID: ${{ inputs.run_id }}
          OBSERVED_SOURCE: ${{ inputs.source_revision }}
        run: python -m tools.ci.observability.summary --scope manual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-triage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/triage/manual.json
          if-no-files-found: error
          retention-days: 30
