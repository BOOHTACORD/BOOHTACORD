name: Build server

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.select.outputs.contracts }}
      map_version: ${{ steps.select.outputs.map_version }}
      map_sha256: ${{ steps.select.outputs.map_sha256 }}
      uncertain: ${{ steps.select.outputs.uncertain }}
      backend: ${{ steps.select.outputs.backend }}
      web: ${{ steps.select.outputs.web }}
      flutter: ${{ steps.select.outputs.flutter }}
      windows: ${{ steps.select.outputs.windows }}
      server: ${{ steps.select.outputs.server }}
      server_release_impact: ${{ steps.select.outputs.server_release_impact }}
      native_release_impact: ${{ steps.select.outputs.native_release_impact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - id: select
        run: python3 -m tools.ci.select_changes.run

  backend:
    needs: changes
    if: needs.changes.outputs.server_release_impact == 'true'
    uses: ./.github/workflows/ci-backend.yaml
    with:
      release_receipt: true
  web:
    needs: changes
    if: needs.changes.outputs.server_release_impact == 'true'
    uses: ./.github/workflows/ci-frontend.yaml
    with:
      release_receipt: true
  contracts:
    needs: changes
    uses: ./.github/workflows/ci-contracts.yaml
    with:
      release_receipt: true
  server-quality:
    if: always()
    needs: [changes, contracts, backend, web]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Require exact-master server quality
        env:
          MASTER_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m tools.ci.master_quality.run server
      - name: Retain source-bound master quality result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-master-server-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/master-server.json
          if-no-files-found: error
          retention-days: 30
      - name: Explain required-check outcome with source-bound sanitized metadata
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIAGE_NEEDS: ${{ toJSON(needs) }}
          CI_GATE_OUTCOME: ${{ job.status }}
        run: python -m tools.ci.observability.summary --scope server
      - name: Retain sanitized required-check triage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: triage-server-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/triage/server.json
          if-no-files-found: error
          retention-days: 30

  bundle:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master' && needs.changes.outputs.server_release_impact == 'true'
    environment: production
    needs: [changes, backend, web, contracts, server-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: trusted-server-bundle-${{ github.repository }}
      cancel-in-progress: false
    env:
      VITE_PUBLIC_ORIGIN: https://v.bootybay.ru
      VITE_SCREEN_SHARE_DESCRIPTOR_V1: ${{ vars.VITE_SCREEN_SHARE_DESCRIPTOR_V1 || 'true' }}
      VITE_SCREEN_SHARE_BOUNDED_SIMULCAST: ${{ vars.VITE_SCREEN_SHARE_BOUNDED_SIMULCAST || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: check-backend-${{ github.sha }}-${{ github.run_id }}-*
          path: .out/gate-artifacts
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: check-web-${{ github.sha }}-${{ github.run_id }}-*
          path: .out/gate-artifacts
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: check-contracts-${{ github.sha }}-${{ github.run_id }}-*
          path: .out/gate-artifacts
          merge-multiple: false
      - name: Select latest passed gate receipts from this workflow run
        env:
          GATE_SOURCE_REVISION: ${{ github.sha }}
          GATE_RUN_ID: ${{ github.run_id }}
          GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 -m tools.build.server.gate_receipts --collect .out/gate-artifacts .out/checks
      - name: Build, attest, smoke-test and sign the immutable bundle
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: bash tools/release/delivery/build.sh
      - name: Retain the exact verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .out/releases/${{ github.sha }}.release.tar.gz
            .out/releases/${{ github.sha }}.release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Retain sanitized source-bound builder timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-metrics-server-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/releases/${{ github.sha }}.build.json
          if-no-files-found: error
          retention-days: 30
