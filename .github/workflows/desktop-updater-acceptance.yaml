name: Desktop updater acceptance package

on:
  workflow_dispatch:
    inputs:
      publish_qa:
        description: Explicitly publish an immutable QA-only prerelease (never latest)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-beta-package:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_qa && github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Resolve locked dependencies
        working-directory: clients/flutter
        run: flutter pub get --enforce-lockfile
      - name: Verify native-storage acceptance isolation
        working-directory: clients/flutter
        run: |
          flutter test --no-pub test/updates/acceptance_storage_test.dart
          flutter analyze --no-pub integration_test/desktop_updates
      - name: Verify actual recovery monitor launch, retention and cancellation
        run: python3 -m unittest tools.build.desktop_updater.test_macos_recovery
      - name: Build the beta-only app with the shipping updater
        run: python3 -m tools.qa.desktop_updates.build_macos
      - name: Publish a fresh immutable QA prerelease (never latest)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const folder = '.out/issue337-macos-acceptance';
            const tag = `qa337-macos-1.0.44-beta-${context.sha}`;
            // createRelease refuses an existing tag/release; never replace assets.
            const {data: release} = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, target_commitish: context.sha,
              name: 'QA #337 — macOS 1.0.44 (79), beta acceptance only',
              body: fs.readFileSync(`${folder}/QA-NOTES.txt`, 'utf8') + `\nSource: ${context.sha}\n`,
              draft: false, prerelease: true, make_latest: 'false'
            });
            for (const name of ['BOOHTACORD-macos-v1.0.44.zip', 'BOOHTACORD-macos-v1.0.44.zip.sha256', 'QA-NOTES.txt']) {
              const data = fs.readFileSync(`${folder}/${name}`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: release.id, name, data,
                headers: {'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain', 'content-length': data.length}
              });
            }
            core.notice(`QA prerelease ready: ${release.html_url}`);
