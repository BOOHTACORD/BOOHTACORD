name: CI Flutter

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+1'
      - name: Verify selected java SDK
        run: python -m tools.ci.toolchains.runtime java
      - uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Test and analyze app and vendor packages
        env:
          BOOHTACORD_VISUAL_CAPTURE_DIR: ${{ github.workspace }}/.out/visual/flutter
        run: python3 -m tools.ci.native.flutter
      - name: Upload Flutter navigation actual
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-navigation-actual-${{ github.sha }}
          path: .out/visual/flutter/R14-navigation-top.png
          if-no-files-found: error
          retention-days: 30
      - name: Retain Flutter UI/UX screenshot review set
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uiux-flutter-visual-review-${{ github.sha }}
          path: .out/visual/flutter/**
          if-no-files-found: error
          retention-days: 30
      - name: Verify Android Kotlin build modes
        run: bash tools/verify/android_kotlin/verify_android_kotlin_modes.sh
      - name: Build Android debug APK
        run: python3 -m tools.build.android.run --debug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boohtacord-android-debug-apk
          path: .out/native/android-debug/
          if-no-files-found: error
          retention-days: 30
