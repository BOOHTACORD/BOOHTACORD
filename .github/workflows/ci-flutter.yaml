name: CI Flutter

on:
  workflow_call:
    inputs:
      evidence_namespace:
        type: string
        default: flutter

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Require fresh synthetic Flutter capture outputs
        env:
          FLUTTER_EVIDENCE_NAMESPACE: ${{ inputs.evidence_namespace }}
        run: python3 -m tools.ci.artifact_policy.run begin flutter dart
      - name: Test and analyze app and vendor packages
        env:
          FLUTTER_EVIDENCE_NAMESPACE: ${{ inputs.evidence_namespace }}
        run: python3 -m tools.ci.flutter_gates.run dart
      - name: Retain mandatory Dart profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-part-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-dart
          path: .out/ci/flutter-parts/dart.json
          if-no-files-found: error
          retention-days: 30
      - name: Package verified synthetic Flutter captures
        if: always()
        env:
          FLUTTER_EVIDENCE_NAMESPACE: ${{ inputs.evidence_namespace }}
          CAPTURE_UPSTREAM_STATUS: ${{ job.status }}
        run: python3 -m tools.ci.artifact_policy.run finish flutter dart
      - name: Retain Flutter UI/UX screenshot review set
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uiux-flutter-visual-review-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/capture-packages/flutter-dart/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && job.status == 'success' && 7 || 30 }}
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+1'
      - name: Verify selected java SDK
        run: python -m tools.ci.toolchains.runtime java
      - uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Verify both Kotlin modes and build the inspected debug APK
        env:
          FLUTTER_EVIDENCE_NAMESPACE: ${{ inputs.evidence_namespace }}
        run: python3 -m tools.ci.flutter_gates.run android
      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boohtacord-android-debug-apk-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/native/android-debug/
          if-no-files-found: error
          retention-days: 30
      - name: Retain mandatory Android profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-part-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-android
          path: .out/ci/flutter-parts/android.json
          if-no-files-found: error
          retention-days: 30

  flutter:
    if: always()
    needs: [dart, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flutter-part-${{ inputs.evidence_namespace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .out/ci/flutter-parts
          merge-multiple: true
      - name: Require complete current Dart and Android evidence
        env:
          FLUTTER_NEEDS: ${{ toJSON(needs) }}
          FLUTTER_EVIDENCE_NAMESPACE: ${{ inputs.evidence_namespace }}
        run: python3 -m tools.ci.flutter_gates.aggregate
