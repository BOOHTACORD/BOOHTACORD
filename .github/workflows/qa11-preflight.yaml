name: QA-11 release host preflight

# GitHub manual host inspection from master.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_USER: shaneque
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read release host image and Buildx capabilities
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release/ssh/configure-deploy-ssh.sh
          remote="${SSH_USER}@${DEPLOY_SERVER_IP}"
          ssh_options=(-i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" "$remote" bash -s < tools/release/preflight/preflight.sh
      - name: Probe pinned temporary Buildx plugin
        shell: bash
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP:?}/docker-buildx"
          curl -fL --retry 2 --max-time 90 https://github.com/docker/buildx/releases/download/v0.37.1/buildx-v0.37.1.linux-amd64 -o "$binary"
          printf '9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b  %s\n' "$binary" | sha256sum -c -
          remote="${SSH_USER}@${DEPLOY_SERVER_IP}"
          incoming="/tmp/voice-platform-qa11-buildx-$(git rev-parse HEAD)"
          ssh_options=(-i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          scp "${ssh_options[@]}" "$binary" "$remote:$incoming"
          ssh "${ssh_options[@]}" "$remote" bash -s -- "$incoming" < tools/build/legacy_server/probe_buildx.sh
