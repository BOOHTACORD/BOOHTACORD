name: Migration readiness and owner GO review

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact tested candidate SHA; empty means current checkout
        type: string
        default: ''
      acceptance_manifest:
        description: Tracked evidence JSON manifest
        type: string
        default: evidence/ci/cutover-acceptance-template.json
      request_go_review:
        description: Request independent protected review after all actual acceptance is recorded
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    outputs:
      ready: ${{ steps.prepare.outputs.ready_for_review }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Report incomplete acceptance without production access
        id: prepare
        env:
          CANDIDATE_SOURCE: ${{ inputs.source_revision }}
          ACCEPTANCE_MANIFEST: ${{ inputs.acceptance_manifest }}
        run: python -m tools.ci.migration.readiness --source "$CANDIDATE_SOURCE" --manifest "$ACCEPTANCE_MANIFEST" --prepare-review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: migration-report-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/migration/readiness.json
          if-no-files-found: error
          retention-days: 30

  review:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master' && inputs.request_go_review && needs.prepare.outputs.ready == 'true'
    needs: prepare
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Verify complete evidence and authenticate independent environment review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE: ${{ inputs.source_revision }}
          ACCEPTANCE_MANIFEST: ${{ inputs.acceptance_manifest }}
          REQUEST_GO_REVIEW: 'true'
        run: python -m tools.ci.migration.readiness --source "$CANDIDATE_SOURCE" --manifest "$ACCEPTANCE_MANIFEST" --review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: migration-owner-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/migration/readiness.json
          if-no-files-found: error
          retention-days: 30
