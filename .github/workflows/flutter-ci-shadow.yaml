name: Flutter CI shadow comparison
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: flutter-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  legacy:
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
    - name: Verify selected Python interpreter
      run: python -m tools.ci.toolchains.runtime python
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: 17.0.20+1
    - name: Verify selected java SDK
      run: python -m tools.ci.toolchains.runtime java
    - uses: ./.github/actions/flutter-setup
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: 'true'
    - name: Test and analyze app and vendor packages
      env:
        BOOHTACORD_VISUAL_CAPTURE_DIR: ${{ github.workspace }}/.out/visual/flutter
      run: python3 -m tools.ci.flutter_gates.legacy dart
    - name: Upload Flutter navigation actual
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: flutter-navigation-actual-${{ env.FLUTTER_EVIDENCE_NAMESPACE }}-${{
          github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .out/visual/flutter/R14-navigation-top.png
        if-no-files-found: error
        retention-days: '30'
    - name: Retain Flutter UI/UX screenshot review set
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: uiux-flutter-visual-review-${{ env.FLUTTER_EVIDENCE_NAMESPACE }}-${{
          github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .out/visual/flutter/**
        if-no-files-found: error
        retention-days: '30'
    - name: Verify Android Kotlin build modes
      run: python3 -m tools.ci.flutter_gates.legacy kotlin
    - name: Build Android debug APK
      run: python3 -m tools.ci.flutter_gates.legacy apk
    - name: Upload Android debug APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: boohtacord-android-debug-apk-${{ env.FLUTTER_EVIDENCE_NAMESPACE }}-${{
          github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .out/native/android-debug/
        if-no-files-found: error
        retention-days: '30'
    - name: Verify complete original phases and measured artifact evidence
      run: python3 -m tools.ci.flutter_gates.legacy finish
    - name: Retain complete original source-bound execution
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: flutter-legacy-${{ env.FLUTTER_EVIDENCE_NAMESPACE }}-${{ github.sha
          }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .out/ci/flutter-legacy.json
        if-no-files-found: error
        retention-days: 30
    name: legacy-${{ matrix.sample }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample:
        - 1
        - 2
        - 3
    env:
      FLUTTER_EVIDENCE_NAMESPACE: shadow-old-${{ matrix.sample }}
  profiles:
    name: profiles-${{ matrix.sample }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample:
        - 1
        - 2
        - 3
    uses: ./.github/workflows/ci-flutter.yaml
    with:
      evidence_namespace: shadow-new-${{ matrix.sample }}
  compare:
    if: always()
    needs:
    - legacy
    - profiles
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 5
    env:
      FLUTTER_EVIDENCE_NAMESPACE: shadow-compare
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: 'false'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
    - name: Verify selected Python interpreter
      run: python -m tools.ci.toolchains.runtime python
    - name: Download only current legacy execution parts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: flutter-legacy-shadow-old-*-${{ github.sha }}-${{ github.run_id }}-${{
          github.run_attempt }}
        path: .out/ci/flutter-shadow-inputs
        merge-multiple: false
    - name: Download only current profile execution parts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: flutter-part-shadow-new-*-${{ github.sha }}-${{ github.run_id }}-${{
          github.run_attempt }}-*
        path: .out/ci/flutter-shadow-inputs
        merge-multiple: false
    - name: Compare complete same-source controls with actual job metadata
      if: always()
      env:
        FLUTTER_SHADOW_NEEDS: ${{ toJSON(needs) }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 -m tools.ci.flutter_gates.measure
    - name: Retain bounded comparison including FAIL or NO_GAIN
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: flutter-ci-shadow-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: .out/ci/flutter-shadow.json
        if-no-files-found: error
        retention-days: 30
