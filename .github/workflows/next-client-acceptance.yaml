name: Next critical client actual acceptance
on:
  pull_request:
    paths:
      - tools/qa/next_client_acceptance/**
      - clients/web/src/conversation/**
      - clients/web/src/direct_message/**
      - clients/web/src/search/**
      - backend/internal/chat/list_text_messages/**
      - backend/internal/chat/list_direct_message_history/**
      - .github/workflows/next-client-acceptance.yaml
permissions:
  contents: read
jobs:
  actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install actual Chromium
        working-directory: clients/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install headed window manager
        run: sudo apt-get install --no-install-recommends --yes openbox
      - name: Test bounded owned native input files
        run: node --test tools/qa/next_client_acceptance/input_files.test.mjs
      - name: Verify real uploads and protected context
        env:
          VITE_PUBLIC_ORIGIN: https://localhost:4810
        run: |
          xvfb-run --auto-servernum bash -c '
            openbox --sm-disable >/dev/null 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid" EXIT
            node tools/qa/next_client_acceptance/visibility_smoke.mjs &&
              python3 -m tools.qa.next_client_acceptance.run
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: next-client-actual-${{ github.sha }}
          path: .out/next-client-acceptance/
          if-no-files-found: ignore
          retention-days: 30
