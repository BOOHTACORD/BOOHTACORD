name: Deploy production

on:
  workflow_run:
    workflows: [Build server]
    branches: [master]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: v-bootybay-production
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      has_bundle: ${{ steps.route.outputs.has_bundle }}
    steps:
      - uses: actions/checkout@v4
      - id: route
        name: Read the trusted producer route without production credentials
        env:
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m tools.release.delivery.routing

  install:
    needs: route
    if: >-
      needs.route.outputs.has_bundle == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      SSH_USER: shaneque
    steps:
      - uses: actions/checkout@v4
      - name: Verify the trusted producer and source revision
        id: producer
        env:
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m tools.release.delivery.provenance
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.producer.outputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: server-${{ steps.producer.outputs.revision }}
          path: .out/incoming
          run-id: ${{ steps.producer.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure pinned SSH transport
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: bash tools/release/ssh/configure-deploy-ssh.sh
      - name: Verify and install the built bundle
        env:
          RELEASE_REVISION: ${{ steps.producer.outputs.revision }}
          BUNDLE_DIRECTORY: .out/incoming
        run: bash tools/release/delivery/transfer.sh
