name: Rehearse compatible image rollback

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the plan and emit NOT_RUN without host access
        type: boolean
        default: true
      current_sha:
        description: Exact currently deployed 40-character source
        required: true
        type: string
      previous_sha:
        description: Exact prevalidated compatible retained source
        required: true
        type: string
      observers_confirmed:
        description: Two authenticated browser observers and a maintenance window are ready
        type: choice
        options: [not-ready, two-browsers-ready]
        default: not-ready
      confirm:
        description: Explicitly authorize rollback followed by restoration of current
        type: choice
        options: [not-ready, rollback-and-restore]
        default: not-ready

permissions:
  contents: read
  actions: read

concurrency:
  group: v-bootybay-production
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_SERVER_IP: 176.108.242.211
      SSH_USER: shaneque
      EXPECTED_SOURCE: ${{ inputs.current_sha }}
      OPERATOR_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      OPERATOR_CONFIRM: ${{ inputs.confirm }}
      PREVIOUS_SOURCE: ${{ inputs.previous_sha }}
      OBSERVERS_CONFIRMED: ${{ inputs.observers_confirmed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Validate authenticated approval and execute the fixed operator capability
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATOR_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: python -m tools.ops.operator.run rollback
      - name: Retain sanitized operator audit receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-rollback-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/operator/rollback/receipt.json
          if-no-files-found: error
          retention-days: 30
