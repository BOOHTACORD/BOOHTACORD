name: Android Release

# A matching android-v* tag publishes signed APKs using repository signing secrets.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify a trusted master or matching-tag candidate without publishing
        type: boolean
        default: false
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci-flutter.yaml

  android-release:
    if: github.repository == 'Egkurilov/BOOHTACORD' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/android-v'))
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'native-release' || 'production' }}
    permissions:
      contents: write
    concurrency:
      group: boohtacord-native-signing
      cancel-in-progress: false
    needs: quality
    env:
      NATIVE_RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Require exact version tag, clean source and master ancestry before SDKs or signing
        id: native-source
        run: python -m tools.release.native_contract.run preflight android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+1'

      - name: Verify selected java SDK
        run: python -m tools.ci.toolchains.runtime java
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Test idempotent GitHub release publisher
        run: node --test tools/release/android/publish.test.mjs tools/release/android/publish_retries.test.mjs tools/release/android/publish_conflicts.test.mjs tools/release/native_contract/publish.test.mjs

      - name: Build and verify the signed Android distribution
        env:
          BOOHTACORD_ANDROID_KEYSTORE_BASE64: ${{ secrets.BOOHTACORD_ANDROID_KEYSTORE_BASE64 }}
          BOOHTACORD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BOOHTACORD_ANDROID_KEYSTORE_PASSWORD }}
          BOOHTACORD_ANDROID_KEY_ALIAS: ${{ secrets.BOOHTACORD_ANDROID_KEY_ALIAS }}
          BOOHTACORD_ANDROID_KEY_PASSWORD: ${{ secrets.BOOHTACORD_ANDROID_KEY_PASSWORD }}
        run: python3 -m tools.build.android.run

      - name: Verify complete signed metadata and exact asset set before publication
        run: python -m tools.release.native_contract.run assets android
      - name: Upload signed APKs as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BOOHTACORD-${{ github.ref_name }}-signed-apks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/flutter/build/release-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable exact-source native release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/native_contract/publish.mjs --platform android
      - name: Retain public native contract and publication result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-android-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/native-release/android/
          if-no-files-found: error
          retention-days: 30
