name: Prepare native release tag

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform whose canonical version tag should point to this master revision
        required: true
        type: choice
        options: [macos, android, windows]

permissions:
  contents: read

jobs:
  prepare-tag:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: write
    concurrency:
      group: boohtacord-native-tags
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare only the canonical exact-master tag without replacing existing refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: python -m tools.release.native_contract.tags "$RELEASE_PLATFORM"
