name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.select.outputs.contracts }}
      map_version: ${{ steps.select.outputs.map_version }}
      map_sha256: ${{ steps.select.outputs.map_sha256 }}
      uncertain: ${{ steps.select.outputs.uncertain }}
      backend: ${{ steps.select.outputs.backend }}
      web: ${{ steps.select.outputs.web }}
      flutter: ${{ steps.select.outputs.flutter }}
      windows: ${{ steps.select.outputs.windows }}
      server: ${{ steps.select.outputs.server }}
      server_release_impact: ${{ steps.select.outputs.server_release_impact }}
      native_release_impact: ${{ steps.select.outputs.native_release_impact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: python3 -m tools.ci.select_changes.run

  contracts:
    uses: ./.github/workflows/ci-contracts.yaml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yaml

  frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-frontend.yaml

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    uses: ./.github/workflows/ci-flutter.yaml

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/flutter-windows.yaml

  ci-required:
    name: ci-required
    if: always()
    needs: [changes, contracts, backend, frontend, flutter, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require successful selector, contracts and applicable component gates
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_JOBS: '{"changes":"changes","contracts":"contracts","backend":"backend","web":"frontend","flutter":"flutter","windows":"windows"}'
        run: python3 -m tools.ci.required_gate.run
