name: Audio research fixtures

on:
  pull_request:
    paths:
      - 'tools/audio/**'
      - 'clients/flutter/packages/flutter_webrtc/common/rnnoise/deepfilter/**'
      - '.github/workflows/audio-research.yaml'
  push:
    branches: [master]
    paths:
      - 'tools/audio/**'
      - 'clients/flutter/packages/flutter_webrtc/common/rnnoise/deepfilter/**'
      - '.github/workflows/audio-research.yaml'
  workflow_call:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - run: >-
          node --test tools/audio/browser_fixture/credentials.test.mjs
          clients/web/scripts/deepfilter_assets.test.mjs
          tools/audio/browser_fixture/research_assets.test.mjs
          tools/audio/research_dfn_web/stage.test.mjs
          tools/audio/research_dfn_web/quality_core.test.mjs
          tools/audio/research_dfn_web/quality_cli.test.mjs
          tools/audio/research_dfn_web/speech_cli.test.mjs
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r tools/audio/speech_metrics/requirements.txt'
      - run: >-
          python -m unittest tools.audio.speech_metrics.test_score
          tools.audio.speech_metrics.test_batch tools.audio.research_dfn_native.test_prepare
          tools.audio.research_dfn_native.test_fingerprint
          tools.audio.research_dfn_web.test_prepare tools.audio.research_dfn_web.test_build
          tools.audio.research_dfn_web.test_livekit_windows

  windows-native-research:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Rikorose/DeepFilterNet
          ref: 7b14b895fe7fc42cab72b4a4c1e49c982bd6404b
          path: .out/dfn-upstream
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Install pinned research toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare source and build twice
        shell: pwsh
        run: |
          python -m tools.audio.research_dfn_native.prepare --source .out/dfn-upstream --output "$env:RUNNER_TEMP/dfn-src" --without-allocation-counter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTFLAGS = '-C target-feature=+crt-static -C link-arg=/Brepro'
          Push-Location "$env:RUNNER_TEMP/dfn-src"
          try {
            foreach ($name in @('dfn-a', 'dfn-b')) {
              cargo +1.97.1 build --release --locked --no-default-features --features capi -p deep_filter --target-dir "$env:RUNNER_TEMP/$name"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally { Pop-Location }
      - name: Compare DLLs and synthetic processing
        shell: pwsh
        run: |
          $a = "$env:RUNNER_TEMP/dfn-a/release/df.dll"
          $b = "$env:RUNNER_TEMP/dfn-b/release/df.dll"
          $model = "$env:RUNNER_TEMP/dfn-src/models/DeepFilterNet3_onnx.tar.gz"
          $hashA = (Get-FileHash -LiteralPath $a -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashB = (Get-FileHash -LiteralPath $b -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hashA -ne $hashB) { throw 'Research DLL builds differ' }
          $one = python -m tools.audio.research_dfn_native.fingerprint --dll $a --dll-sha256 $hashA --model $model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $two = python -m tools.audio.research_dfn_native.fingerprint --dll $b --dll-sha256 $hashB --model $model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($one -ne $two) { throw 'Synthetic processing outputs differ' }
          Write-Output "Research DLL SHA-256: $hashA"
          Write-Output $one
