name: Windows Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify a trusted master or matching-tag candidate without publishing
        type: boolean
        default: false
  push:
    tags: ['windows-v*']

permissions:
  contents: read

jobs:
  windows-release:
    if: github.repository == 'Egkurilov/BOOHTACORD' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/windows-v'))
    environment: production
    permissions:
      contents: write
    concurrency:
      group: boohtacord-native-signing
      cancel-in-progress: false
    env:
      NATIVE_RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Require exact version tag, clean source and master ancestry before SDKs or signing
        id: native-source
        run: python -m tools.release.native_contract.run preflight windows
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.426'
      - name: Verify selected dotnet SDK
        run: python -m tools.ci.toolchains.runtime dotnet
      - name: Test release publisher
        run: node --test tools/release/android/publish.test.mjs tools/release/android/publish_retries.test.mjs tools/release/android/publish_conflicts.test.mjs tools/release/windows/publish.test.mjs tools/release/native_contract/publish.test.mjs
      - name: Initialize Flutter before reading machine JSON
        run: flutter --version
      - name: Test and analyze app and vendor packages
        run: python -m tools.ci.native.flutter
      - name: Build and inspect Windows distribution
        run: python -m tools.build.windows.run
      - name: Package immutable Windows release
        shell: pwsh
        run: |
          $tag = (Get-Content '.out/native-release/windows/source.json' -Raw | ConvertFrom-Json).tag
          $release = 'clients/flutter/build/windows/x64/runner/Release'
          $assets = 'clients/flutter/build/release-assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $zip = Join-Path $assets "BOOHTACORD-$tag-x64.zip"
          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item "$release/artifact-manifest.json" "$assets/artifact-manifest.json"
          Copy-Item ".out/releases/windows/*Setup.exe" "$assets/"
          Copy-Item ".out/releases/windows/*-full.nupkg" "$assets/"
          Copy-Item ".out/releases/windows/releases.stable.json" "$assets/"
          $lines = Get-ChildItem $assets -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          Set-Content -LiteralPath "$assets/SHA256SUMS" -Value $lines -Encoding utf8NoBOM
      - name: Verify complete signed metadata and exact asset set before publication
        run: python -m tools.release.native_contract.run assets windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOOHTACORD-${{ github.ref_name }}-windows-x64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/flutter/build/release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable exact-source native release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/native_contract/publish.mjs --platform windows
      - name: Retain public native contract and publication result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-windows-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/native-release/windows/
          if-no-files-found: error
          retention-days: 30
