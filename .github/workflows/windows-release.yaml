name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']

permissions:
  contents: write

jobs:
  windows-release:
    concurrency:
      group: boohtacord-native-signing
      cancel-in-progress: false
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test release publisher
        run: node --test tools/release/android/publish.test.mjs tools/release/android/publish_retries.test.mjs tools/release/android/publish_conflicts.test.mjs tools/release/windows/publish.test.mjs
      - name: Test and analyze app and vendor packages
        run: python -m tools.ci.native.flutter
      - name: Build and inspect Windows distribution
        run: python -m tools.build.windows.run
      - name: Package immutable Windows release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $release = 'clients/flutter/build/windows/x64/runner/Release'
          $assets = 'clients/flutter/build/release-assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $zip = Join-Path $assets "BOOHTACORD-$tag-x64.zip"
          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item "$release/artifact-manifest.json" "$assets/artifact-manifest.json"
          $lines = Get-ChildItem $assets -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          Set-Content -LiteralPath "$assets/SHA256SUMS" -Value $lines -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: BOOHTACORD-${{ github.ref_name }}-windows-x64
          path: clients/flutter/build/release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = 'clients/flutter/build/release-assets'
          node tools/release/windows/publish.mjs --tag $env:GITHUB_REF_NAME `
            --asset "$assets/BOOHTACORD-$env:GITHUB_REF_NAME-x64.zip" `
            --asset "$assets/artifact-manifest.json" `
            --asset "$assets/SHA256SUMS"
