name: Compatible rollback acceptance

on:
  workflow_dispatch:
    inputs:
      installation:
        description: Also exercise actual isolated SSH installs, same-SHA retry, interruption and failures
        type: boolean
        default: false
      current_source:
        description: Exact 40-character current source with successful master producer
        type: string
        required: true
      current_run:
        description: Completed successful master quality run for current_source
        type: string
        required: true
      previous_source:
        description: Exact compatible previous source
        type: string
        required: true
      previous_run:
        description: Completed successful master quality run for previous_source
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: qa60-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    if: github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Node SDK and locked dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .out/ci/cache-inputs/npm.json
      - name: Validate and fetch explicit retained source objects
        env:
          CURRENT_SOURCE: ${{ inputs.current_source }}
          CURRENT_RUN: ${{ inputs.current_run }}
          PREVIOUS_SOURCE: ${{ inputs.previous_source }}
          PREVIOUS_RUN: ${{ inputs.previous_run }}
        run: python -m tools.ci.actual_acceptance.manual_inputs
      - name: Verify actual source-bound CI results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tools.qa.compatible_rollback.ci_proof .out/issue60/ci-inputs.json .out/issue60/ci-proof.json
      - name: Install locked browser dependencies
        working-directory: clients/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test rollback evidence and isolation guards
        run: python -m unittest tools.qa.compatible_rollback.test_evidence tools.qa.compatible_rollback.test_isolation tools.qa.compatible_rollback.test_ci_proof tools.qa.compatible_rollback.test_source_inputs tools.qa.compatible_rollback.test_diagnostics tools.qa.compatible_rollback.test_builder_identity tools.release.rollback.test_rollout tools.build.server.test_smoke_readiness tools.build.server.test_runtime_inputs tools.build.server.test_social_preview tools.build.server.test_image_audio_flag
      - name: Test isolated trusted installation evidence and boundaries
        if: inputs.installation
        run: python -m unittest tools.qa.trusted_delivery.test_attempt tools.qa.trusted_delivery.test_catalog tools.qa.trusted_delivery.test_faults tools.qa.trusted_delivery.test_receipts tools.qa.trusted_delivery.test_ssh_fixture tools.qa.trusted_delivery.test_variant tools.qa.trusted_delivery.test_evidence tools.qa.trusted_delivery.test_runtime_inputs tools.qa.trusted_delivery.test_interruption tools.qa.trusted_delivery.test_historical_delivery tools.qa.trusted_delivery.test_harness_diagnostics
      - name: Rehearse actual signed rollback with two browser observers
        if: ${{ !inputs.installation }}
        run: python -m tools.qa.compatible_rollback.run --ci-proof .out/issue60/ci-proof.json
      - name: Rehearse shipping SSH install and recovery on the isolated real stack
        if: inputs.installation
        run: python -m tools.qa.trusted_delivery.run --ci-proof .out/issue60/ci-proof.json
      - name: Retain only sanitized runtime evidence and synthetic captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa60-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .out/issue60/runtime/run.json
            .out/issue60/runtime/acceptance.json
            .out/issue60/runtime/browser.json
            .out/issue60/runtime/*.png
            .out/issue395/runtime/run.json
            .out/issue395/runtime/delivery.json
            .out/issue395/runtime/negatives.json
            .out/issue395/runtime/browser.json
            .out/issue395/runtime/build-*.json
            .out/issue395/runtime/*.png
          if-no-files-found: error
          retention-days: 30
