name: Installed Windows updater acceptance

on:
  workflow_dispatch:
    inputs:
      publish_qa:
        description: Explicitly publish an immutable QA-only prerelease (never latest)
        type: boolean
        default: false
      envelope_revision:
        description: Immutable 40-character commit containing the owner-signed QA fixture for this source
        type: string
        required: true

concurrency:
  group: installed-windows-updater-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-stack:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Go SDK and dependency cache inputs
        run: python -m tools.ci.toolchains.cache_inputs go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: .out/ci/cache-inputs/go.json
      - name: Check fixture ownership and bounded startup diagnostics
        run: python -m unittest tools.qa.desktop_updates.test_windows_tools tools.qa.desktop_updates.test_windows_journey tools.qa.desktop_updates.test_windows_stack
      - name: Test actual Windows filesystem capacity API
        working-directory: backend
        run: go test ./internal/storage/reserve_upload_space
      - name: Verify native API, PostgreSQL and SFU before rebuilding clients
        run: python -m tools.qa.desktop_updates.windows_stack
  installed-update:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_qa && github.repository == 'Egkurilov/BOOHTACORD' && github.ref == 'refs/heads/master'
    environment: production
    needs: native-stack
    runs-on: windows-2022
    timeout-minutes: 85
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Enable long paths for the native build
        run: git config --system core.longpaths true
      - name: Prepare public Go SDK and dependency cache inputs
        run: python -m tools.ci.toolchains.cache_inputs go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: .out/ci/cache-inputs/go.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.426'
      - name: Verify selected dotnet SDK
        run: python -m tools.ci.toolchains.runtime dotnet
      - uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Verify confined pinned fixture tools
        run: python -m unittest tools.qa.desktop_updates.test_windows_tools
      - name: Resolve locked dependencies and analyze the release UI driver
        working-directory: clients/flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub integration_test/desktop_updates
      - name: Build real 78 and 79 beta clients, Setup and full packages
        run: python -m tools.qa.desktop_updates.build_windows
      - name: Publish immutable QA79 package, never latest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const folder = '.out/issue337-windows-packages';
            const {data: release} = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: `qa337-windows-1.0.44-beta-${context.sha}`,
              target_commitish: context.sha,
              name: 'QA #337 — Windows installed update 78 to 79',
              body: fs.readFileSync(`${folder}/QA-NOTES.txt`, 'utf8'),
              draft: false, prerelease: true, make_latest: 'false'
            });
            const names = fs.readdirSync(`${folder}/79`).filter(n => n.endsWith('-full.nupkg'));
            if (names.length !== 1) throw new Error('One native full package required');
            for (const [file, name] of [
              [`${folder}/79/${names[0]}`, names[0]],
              [`${folder}/79/qa-identity.json`, 'qa-identity.json'],
              [`${folder}/QA-NOTES.txt`, 'QA-NOTES.txt']
            ]) {
              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
              });
            }
            core.notice(`WAITING FOR OWNER SIGNATURE: ${release.html_url}`);
      - name: Run real installed update with native loopback API, PostgreSQL and SFU
        env:
          QA_ENVELOPE_REVISION: ${{ inputs.envelope_revision }}
        run: python -m tools.qa.desktop_updates.windows_journey --source $env:GITHUB_SHA --wait-seconds 1800
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-installed-update-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .out/issue337-windows-acceptance/
            .out/issue337-windows-packages/78/qa-identity.json
            .out/issue337-windows-packages/79/qa-identity.json
          if-no-files-found: error
          retention-days: 30
