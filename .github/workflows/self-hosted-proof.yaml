name: Self-hosted Linux pool proof

on:
  push:
    branches: [codex/self-hosted-runners]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        probe: [one, two]
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: voice_platform_test
          POSTGRES_USER: voice_platform_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_platform_test -d voice_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Verify isolated guest, private Docker and fresh workspace
        env:
          PGPASSWORD: test-only-password
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$BOOHTACORD_EPHEMERAL_GUEST" = true
          test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296
          test "$(nproc)" = 3
          test ! -e /home/runner/previous-job-marker
          touch /home/runner/previous-job-marker
          psql -h 127.0.0.1 -U voice_platform_test -d voice_platform_test -c 'SELECT 1'
          python -m tools.ci.toolchains.runtime python
          python -m unittest tools.ci.runner_pool.test_worker
          docker version --format '{{.Server.Version}}'

  metadata:
    runs-on: [self-hosted, linux, x64, boohtacord-ci-meta]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        probe: [one, two]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Verify bounded fresh metadata guest
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$BOOHTACORD_EPHEMERAL_GUEST" = true
          test "$(cat /sys/fs/cgroup/memory.max)" = 536870912
          test "$(nproc)" = 1
          test ! -e /home/runner/previous-job-marker
          touch /home/runner/previous-job-marker
          python -m unittest tools.ci.runner_pool.test_worker
