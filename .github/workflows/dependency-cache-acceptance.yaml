name: Dependency cache acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/ci/toolchains/**'
      - 'tools/ci/cache_measure/**'
      - 'tools/toolchains.json'
      - '.github/workflows/dependency-cache-acceptance.yaml'

permissions:
  contents: read

jobs:
  cold-warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Prepare public Go SDK and dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: .out/ci/cache-inputs/go.json
          cache: false
      - name: Measure isolated cold and warm public caches without skipping assertions
        run: python3 -m tools.ci.cache_measure.run
      - name: Retain complete sanitized cache observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-cache-${{ github.sha }}
          path: .out/cache-measure/report.json
          if-no-files-found: error
          retention-days: 30

  macos-python:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
