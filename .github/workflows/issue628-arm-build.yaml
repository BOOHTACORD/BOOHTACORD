name: Issue 628 ARM64 isolated build
on:
  push:
    branches: [codex/egress-arm-build-628]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the pinned Egress recipe
        run: docker build -f deploy/livekit/egress-clock-fix/Dockerfile -t local-egress-628 .
      - name: Extract the ARM64 binary
        run: |
          id=$(docker create local-egress-628)
          docker cp "$id:/bin/egress" egress-arm64
          docker rm "$id"
          sha256sum egress-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: issue628-egress-arm64
          path: egress-arm64
          retention-days: 1
          if-no-files-found: error
