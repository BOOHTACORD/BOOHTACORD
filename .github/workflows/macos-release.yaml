name: macOS Release

# GitHub manual release from the matching macos-vX.Y.Z tag.

# Dispatch from the matching macos-vX.Y.Z tag. The public runner builds the
# existing ad-hoc distribution without a local signing key or runner setup.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify a trusted master or matching-tag candidate without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-release:
    if: github.repository == 'Egkurilov/BOOHTACORD' && (startsWith(github.ref, 'refs/tags/macos-v') || (github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.dry_run))
    environment: production
    permissions:
      contents: write
    concurrency:
      group: boohtacord-native-signing
      cancel-in-progress: false
    env:
      NATIVE_RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Require exact version tag, clean source and master ancestry before SDKs or signing
        id: native-source
        run: python -m tools.release.native_contract.run preflight macos
      - name: Require reviewed Apple toolchain before native compilation
        run: python -m tools.ci.macos.host --arch arm64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Test the shared immutable native publisher
        run: node --test tools/release/native_contract/publish.test.mjs
      - name: Set up Flutter 3.47.7
        uses: ./.github/actions/flutter-setup
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Verify Flutter toolchain and release tag
        working-directory: clients/flutter
        env:
          RELEASE_TAG: ${{ steps.native-source.outputs.tag }}
        run: |
          set -euo pipefail
          flutter --version
          app_version="$(sed -E -n 's/^version: *([0-9][0-9.]*)\+[0-9][0-9]*$/\1/p' pubspec.yaml)"
          if [[ -z "$app_version" || "$RELEASE_TAG" != "macos-v$app_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match clients/flutter/pubspec.yaml version $app_version" >&2
            exit 1
          fi

      - name: Resolve locked Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get --enforce-lockfile

      - name: Test release packaging
        run: bash tools/build/macos/package.test.sh

      - name: Run Flutter tests
        working-directory: clients/flutter
        run: flutter test

      - name: Analyze Flutter client
        working-directory: clients/flutter
        run: flutter analyze --no-fatal-infos

      - name: Build universal macOS release client
        run: python3 -m tools.build.macos.run

      - name: Package app and checksum
        env:
          RELEASE_TAG: ${{ steps.native-source.outputs.tag }}
        run: |
          set -euo pipefail
          bash tools/build/macos/package.sh \
            clients/flutter/build/macos/Build/Products/Release/BOOHTACORD.app \
            "$RELEASE_TAG" \
            clients/flutter/build/release-assets

      - name: Inspect signature and retain distribution manifest
        run: python3 -m tools.build.macos.metadata clients/flutter/build/macos/Build/Products/Release/BOOHTACORD.app clients/flutter/build/release-assets

      - name: Verify complete signed metadata and exact asset set before publication
        run: python -m tools.release.native_contract.run assets macos
      - name: Retain verified macOS candidate assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BOOHTACORD-${{ github.ref_name }}-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: clients/flutter/build/release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable exact-source native release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/native_contract/publish.mjs --platform macos
      - name: Retain public native contract and publication result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-release-macos-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/native-release/macos/
          if-no-files-found: error
          retention-days: 30
