name: macOS Release

# GitHub manual release from the matching macos-vX.Y.Z tag.

# Temporary: don't queue tag-triggered releases without a macOS runner.
# Manually dispatch from the matching macos-vX.Y.Z tag when the runner is back.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-release:
    concurrency:
      group: boohtacord-native-signing
      cancel-in-progress: false
    runs-on: [self-hosted, macos]
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Verify Flutter toolchain and release tag
        working-directory: clients/flutter
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flutter --version
          app_version="$(sed -E -n 's/^version: *([0-9][0-9.]*)\+[0-9][0-9]*$/\1/p' pubspec.yaml)"
          if [[ -z "$app_version" || "$RELEASE_TAG" != "macos-v$app_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match clients/flutter/pubspec.yaml version $app_version" >&2
            exit 1
          fi

      - name: Cache patched macOS WebRTC SDK
        id: webrtc-sdk-cache
        uses: actions/cache@v4
        with:
          path: clients/flutter/packages/flutter_webrtc/macos/flutter_webrtc/Binary/
          key: webrtc-macos-${{ runner.arch }}-${{ hashFiles('clients/flutter/packages/flutter_webrtc/third_party/apple-sdk.json', 'clients/flutter/packages/flutter_webrtc/third_party/patches/webrtc-sdk-*.patch', 'tools/build/webrtc_sdk/build_macos.py') }}

      - name: Build patched macOS WebRTC SDK
        if: steps.webrtc-sdk-cache.outputs.cache-hit != 'true'
        run: python3 tools/build/webrtc_sdk/build_macos.py --test

      - name: Verify installed WebRTC SDK
        run: python3 tools/build/webrtc_sdk/build_macos.py --verify

      - name: Resolve locked Flutter dependencies
        working-directory: clients/flutter
        run: flutter pub get --enforce-lockfile

      - name: Test release packaging
        run: bash tools/build/macos/package.test.sh

      - name: Run Flutter tests
        working-directory: clients/flutter
        run: flutter test

      - name: Analyze Flutter client
        working-directory: clients/flutter
        run: flutter analyze --no-fatal-infos

      - name: Build universal macOS release client
        working-directory: clients/flutter
        run: flutter build macos --release --no-pub

      - name: Package app and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash tools/build/macos/package.sh \
            clients/flutter/build/macos/Build/Products/Release/BOOHTACORD.app \
            "$RELEASE_TAG" \
            clients/flutter/build/release-assets

      - name: Inspect signature and retain distribution manifest
        run: python3 -m tools.build.macos.metadata clients/flutter/build/macos/Build/Products/Release/BOOHTACORD.app clients/flutter/build/release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: BOOHTACORD macOS ${{ github.ref_name }}
          body: |
            Universal macOS app for version ${{ github.ref_name }} (Apple Silicon and Intel).

            The app is ad-hoc signed and is not notarized by Apple. Gatekeeper may require the user to approve opening the downloaded app.

            Verify the ZIP with the included SHA-256 checksum before extracting it.
          files: |
            clients/flutter/build/release-assets/BOOHTACORD-${{ github.ref_name }}.zip
            clients/flutter/build/release-assets/BOOHTACORD-${{ github.ref_name }}.zip.sha256
            clients/flutter/build/release-assets/artifact-manifest.json
            clients/flutter/build/release-assets/SHA256SUMS
          draft: false
          prerelease: false
