name: Backend same-source functional shadow

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy:
    if: github.repository == 'BOOHTACORD/BOOHTACORD' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: voice_platform_test
          POSTGRES_USER: voice_platform_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_platform_test -d voice_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOICE_PLATFORM_TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Go SDK and dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache-dependency-path: .out/ci/cache-inputs/go.json
      - name: Run the complete original coverage sequentially
        run: python3 -m tools.ci.backend_gates.shadow_legacy
      - name: Retain sequential source-bound result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-shadow-legacy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/backend-shadow-legacy.json
          if-no-files-found: error
          retention-days: 30

  profiles:
    if: github.repository == 'BOOHTACORD/BOOHTACORD' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci-backend.yaml
    with:
      release_receipt: false

  compare:
    if: always() && github.repository == 'BOOHTACORD/BOOHTACORD' && github.ref == 'refs/heads/master'
    needs: [legacy, profiles]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Invalidate any previous comparison
        run: python3 -m tools.ci.backend_gates.shadow_measure --prepare-only
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-shadow-legacy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/backend-shadow-inputs/legacy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-part-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .out/ci/backend-shadow-inputs/parts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-fan-in-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/backend-shadow-inputs/fan-in
      - name: Require complete same-source functional parity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKEND_SHADOW_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m tools.ci.backend_gates.shadow_measure
      - name: Retain only bounded public comparison metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-shadow-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/ci/backend-shadow.json
          if-no-files-found: error
          retention-days: 30
