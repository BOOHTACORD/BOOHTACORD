name: Windows promotion catalog readback

on:
  workflow_run:
    workflows: [Deploy production]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: Successful Deploy production run whose retained receipt should be verified
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  readback:
    if: >-
      github.repository == 'Egkurilov/BOOHTACORD' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, boohtacord-ci-ephemeral]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Verify retained deployment chain and read only the intended public catalog
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_run_id || github.event.workflow_run.id }}
        run: python -m tools.release.windows_promotion.readback
      - name: Retain source-bound public promotion trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-promotion-readback-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/windows-promotion-readback/trace.json
          if-no-files-found: error
          retention-days: 30
