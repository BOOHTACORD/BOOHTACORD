name: CI backend

on:
  workflow_call:
    inputs:
      release_receipt:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: voice_platform_test
          POSTGRES_USER: voice_platform_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_platform_test -d voice_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VOICE_PLATFORM_TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://voice_platform_test:test-only-password@127.0.0.1:5432/voice_platform_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.12.15' || '3.12.10' }}
      - name: Verify selected Python interpreter
        run: python -m tools.ci.toolchains.runtime python
      - name: Prepare public Go SDK and dependency cache inputs
        run: python3 -m tools.ci.toolchains.cache_inputs go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: .out/ci/cache-inputs/go.json
      - name: Test, vet and build Go API
        run: python3 -m tools.ci.receipts.run backend
      - name: Validate screen-share media load profile matrix
        run: python3 -m unittest tools.load.screen_share_matrix.test_planner
      - name: Exercise owned real API load smoke
        timeout-minutes: 8
        run: |
          python3 -m tools.load.controller.run --accounts 2 --seconds 20 --profile normal
          python3 -m tools.load.controller.run --accounts 2 --seconds 20 --profile reconnect
          python3 -m tools.load.controller.run --accounts 2 --seconds 20 --profile uploads --upload-bytes 1024
          python3 -m tools.load.controller.run --accounts 1 --seconds 20 --profile nat_auth
          python3 -m tools.load.controller.run --accounts 2 --seconds 40 --profile faults
      - name: Retain sanitized load smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-load-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .out/backend-load/**/report.json
            .out/backend-load/**/routes.csv
            .out/backend-load/**/report.html
          if-no-files-found: error
          retention-days: 14
      - name: Retain source-bound gate receipt
        if: inputs.release_receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-backend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .out/checks/backend.json
          if-no-files-found: error
          retention-days: 30
