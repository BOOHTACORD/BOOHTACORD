version: '3'

vars:
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'

tasks:
  doctor:
    cmds: ['{{.PYTHON}} -m tools.ci.native.doctor']
  check:toolchains:
    cmds: ['{{.PYTHON}} -m tools.verify.toolchains.check']
  check:contracts:
    cmds: ['{{.PYTHON}} -m tools.ci.native.contracts']
  test:backend:
    cmds: ['{{.PYTHON}} -m tools.ci.native.backend']
  test:web:
    cmds: ['{{.PYTHON}} -m tools.ci.native.web']
  test:flutter:
    cmds: ['{{.PYTHON}} -m tools.ci.native.flutter']
  test:sql-authorization:
    cmds: ['{{.PYTHON}} -m tools.verify.sql_authorization.run']
  test:android-unit:
    cmds:
      - cmd: flutter pub get --enforce-lockfile
        dir: clients/flutter
      - bash tools/verify/android_kotlin/verify_android_kotlin_modes.sh
  test:macos-unit:
    cmds: ['{{.PYTHON}} -m tools.verify.macos_unit.run']
  build:server:
    cmds: ['{{.PYTHON}} -m tools.build.server.run {{.CLI_ARGS}}']
  build:android:
    cmds: ['{{.PYTHON}} -m tools.build.android.run {{.CLI_ARGS}}']
  build:windows:
    cmds: ['{{.PYTHON}} -m tools.build.windows.run']
  release:verify:
    cmds: ['{{.PYTHON}} -m tools.release.bundle.verify {{.CLI_ARGS}}']
  release:install:
    cmds: ['{{.PYTHON}} -m tools.release.install.run {{.CLI_ARGS}}']
  release:rollback:
    cmds: ['{{.PYTHON}} -m tools.release.rollback.run {{.CLI_ARGS}}']
  ci:readiness:
    desc: Report migration NO-GO until source-bound actual evidence and independent owner review exist
    cmds:
      - '{{.PYTHON}} -m tools.ci.migration.readiness'
  ci:workflow-rollback:preview:
    desc: Write a reviewable configuration-only rollback plan without changing files or production
    cmds:
      - '{{.PYTHON}} -m tools.ci.migration.rollback preview'
