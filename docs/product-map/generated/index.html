function matchesFeature(feature, selected, group, filter) {
  if (group !== 'all' && feature.group !== group) return false;
  if (filter === 'all') return true;
  return selected.some(name => {
    const item = feature.platforms[name];
    if (filter === 'behind') return item.source_status === 'BEHIND';
    if (filter === 'differences') return ['BEHIND', 'AHEAD_UNREVIEWED', 'MISSING', 'INTENTIONAL_DIFFERENCE'].includes(item.source_status);
    if (filter === 'exceptions') return ['PLATFORM_EXCEPTION', 'NOT_APPLICABLE'].includes(item.applicability);
    if (filter === 'unverified') return item.source_status === 'UNKNOWN' || item.released === 'UNKNOWN' || ['NOT_VERIFIED', 'NOT_RUN', 'BLOCKED'].includes(item.runtime);
    return false;
  });
}

function formatCell(item, layers) {
  const lines = [];
  if (layers.source) {
    const revision = value => Number.isInteger(value) && value > 0 ? 'r' + value : '?';
    const versions = item.implemented_revision != null || item.target_revision != null
      ? ' (' + revision(item.implemented_revision) + ' → ' + revision(item.target_revision) + ')' : '';
    lines.push('Код: ' + item.source_status + versions);
  }
  if (layers.release) lines.push('Релиз: ' + item.released);
  if (layers.runtime) lines.push('Runtime: ' + item.runtime);
  return lines.length ? lines.join('\n') : 'Слои не выбраны';
}

function sourceURL(path, revision) {
  if (typeof path !== 'string' || !path || path.length > 4096 || /[\\:\x00-\x1f\x7f]/.test(path) ||
      path.split('/').some(part => !part || part === '.' || part === '..')) return null;
  if (revision != null && (typeof revision !== 'string' || !/^[0-9a-f]{40}$/.test(revision))) return null;
  const ref = revision == null ? 'master' : revision;
  return 'https://github.com/BOOHTACORD/BOOHTACORD/blob/' + ref + '/' + path.split('/').map(encodeURIComponent).join('/');
}
function issueURL(value) {
  return Number.isSafeInteger(value) && value > 0 ? 'https://github.com/BOOHTACORD/BOOHTACORD/issues/' + value : null;
}
function externalLink(url, label) {
  const link = document.createElement('a');
  link.href = url; link.textContent = label; link.target = '_blank'; link.rel = 'noopener noreferrer';
  return link;
}
function renderDetail(feature, detail) {
  detail.replaceChildren();
  if (!feature) { detail.textContent = 'Сценарий не найден.'; return; }
  const title = document.createElement('h3'); title.textContent = feature.title || feature.id; detail.appendChild(title);
  const issue = issueURL(feature.issue);
  if (issue) { const p = document.createElement('p'); p.appendChild(externalLink(issue, 'Задача #' + feature.issue)); detail.appendChild(p); }
  if ((feature.depends_on || []).length) {
    const heading = document.createElement('h4'); heading.textContent = 'Зависит от функций'; detail.appendChild(heading);
    const dependencies = document.createElement('ul');
    for (const identifier of feature.depends_on) {
      const item = document.createElement('li'), link = document.createElement('a');
      link.href = '#feature/' + encodeURIComponent(identifier); link.textContent = identifier;
      item.appendChild(link); dependencies.appendChild(item);
    }
    detail.appendChild(dependencies);
  }
  const components = feature.components || [];
  if (!components.length) { detail.append('Компоненты пока не описаны.'); return; }
  const note = document.createElement('p');
  note.textContent = feature.source_revision == null ? 'Исходники в master, без привязки к SHA.' : 'Исходники по указанному SHA; происхождение не подтверждено.';
  detail.appendChild(note);
  const list = document.createElement('ul');
  for (const component of components) {
    const item = document.createElement('li');
    item.append(document.createTextNode(component.id + ': '));
    component.paths.forEach((path, index) => {
      if (index) item.append(document.createTextNode(', '));
      const url = sourceURL(path, feature.source_revision);
      item.append(url ? externalLink(url, path) : document.createTextNode(path));
    });
    list.appendChild(item);
  }
  detail.appendChild(list);
  const edges = feature.component_edges || [], heading = document.createElement('h4');
  heading.textContent = 'Связи компонентов'; detail.appendChild(heading);
  if (!edges.length) { detail.append('Связи пока не описаны.'); return; }
  const graph = document.createElement('ul');
  for (const edge of edges) {
    const line = document.createElement('li');
    line.textContent = edge.from + ' → ' + edge.to + ' (зависит от)'; graph.appendChild(line);
  }
  detail.appendChild(graph);
}

const platforms = ['web', 'windows', 'macos', 'android', 'ios'];
const rows = document.getElementById('rows');

const sourceLayer = document.getElementById('layer-source'), releaseLayer = document.getElementById('layer-release');
const runtimeLayer = document.getElementById('layer-runtime');
const names = {web: 'Web', windows: 'Windows', macos: 'macOS', android: 'Android', ios: 'iOS'};
for (const name of [...new Set(data.map(item => item.group).filter(Boolean))].sort()) {
  const option = document.createElement('option'); option.value = name; option.textContent = name; domain.appendChild(option);
}
function cell(row, value) {
  const node = document.createElement('td');
  node.textContent = value;
  row.appendChild(node);
}
function render() {
  rows.replaceChildren();
  const selected = platforms.includes(platform.value) ? [platform.value] : platforms;
  const layers = {source: sourceLayer.checked, release: releaseLayer.checked, runtime: runtimeLayer.checked};
  header.replaceChildren();
  for (const name of ['Сценарий', ...selected.map(value => names[value])]) {
    const th = document.createElement('th'); th.scope = 'col'; th.textContent = name; header.appendChild(th);
  }
  const query = search.value.trim().toLocaleLowerCase();
  let visible = 0;
  for (const feature of data) {
    if (!(feature.id + ' ' + (feature.title || '') + ' ' + feature.description).toLocaleLowerCase().includes(query) ||
        !matchesFeature(feature, selected, domain.value || 'all', status.value || 'all')) continue;
    const row = document.createElement('tr');
    const heading = document.createElement('th');
    heading.scope = 'row';
    const link = document.createElement('a');
    link.href = '#feature/' + encodeURIComponent(feature.id);
    link.textContent = feature.id;
    heading.append(link, document.createElement('br'), document.createTextNode(feature.description));
    row.appendChild(heading);
    for (const name of selected) {
      const item = feature.platforms[name];
      cell(row, formatCell(item, layers));
    }
    rows.appendChild(row);
    visible++;
  }
  count.textContent = 'Сценариев: ' + visible;
}
search.addEventListener('input', render);
for (const control of [platform, domain, status, sourceLayer, releaseLayer, runtimeLayer]) control.addEventListener('change', render);
function selectHash() {
  const match = location.hash.match(/^#feature\/(.*)$/);
  if (!match) return;
  try {
    search.value = decodeURIComponent(match[1]);
    domain.value = 'all'; status.value = 'all';
    render();
    const feature = data.find(item => item.id === search.value);

}
