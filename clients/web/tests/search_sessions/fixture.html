<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search session regression</title><div id="app"></div>
<script type="module">
import {createApp,h,ref} from 'vue'
import {createPinia} from 'pinia'
import SearchPanel from '/src/search/SearchPanel.vue'
import {clearAuthenticatedState} from '/src/identity/clear_authenticated_state.ts'
import '/src/style.css'
const open=ref(true), current=ref('b'),pinia=createPinia()
const conversations={b:{id:'qa-dm-b',kind:'DIRECT_MESSAGE',label:'Peer B'},c:{id:'qa-dm-c',kind:'DIRECT_MESSAGE',label:'Peer C'}}
createApp({render:()=>h('main',[
 h('button',{onClick:()=>{current.value='b';open.value=true}},'Search B'),
 h('button',{onClick:()=>{open.value=false}},'Hide search'),
 h('button',{onClick:()=>{current.value='c';open.value=true}},'Search C'),
 h('button',{onClick:()=>{open.value=false;clearAuthenticatedState(pinia)}},'End account'),
 open.value?h('aside',{class:'members search-aside',style:{display:'flex',flexDirection:'column',position:'relative',inset:'auto',height:'650px',overflow:'auto'}},[h(SearchPanel,{currentConversation:conversations[current.value],channelLabels:{},directMessageLabels:{},onClose:()=>{open.value=false}})]):null
])}).use(pinia).mount('#app')
</script></html>
