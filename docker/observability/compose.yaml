name: boohtacord-observability

services:
  collector:
    image: otel/opentelemetry-collector:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on: [tempo]
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  tempo:
    image: grafana/tempo:2.10.3
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  prometheus:
    image: prom/prometheus:v3.11.2
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./guild-lifecycle-alerts.yaml:/etc/prometheus/guild-lifecycle-alerts.yaml:ro
      - ./livekit-network-alerts.yaml:/etc/prometheus/livekit-network-alerts.yaml:ro
      - ./media-qoe-alerts.yaml:/etc/prometheus/media-qoe-alerts.yaml:ro
      - ./voice-roster-alerts.yaml:/etc/prometheus/voice-roster-alerts.yaml:ro
      - ./notification-alerts.yaml:/etc/prometheus/notification-alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    depends_on: [collector, tempo]
    networks: [default, livekit-metrics]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  tempo-data:
  prometheus-data:

networks:
  livekit-metrics:
    external: true
    name: voice-platform_livekit-metrics
