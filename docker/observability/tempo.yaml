server:
  http_listen_port: 3200

query_frontend:
  # Optional legacy fields require explicit spanset branches on Tempo 2.10.3.
  # Keep the expanded, scoped expressions bounded instead of truncating at 2 KiB.
  max_query_expression_size_bytes: 8192

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
