global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/notification-alerts.yaml
  - /etc/prometheus/guild-lifecycle-alerts.yaml
  - /etc/prometheus/livekit-network-alerts.yaml
  - /etc/prometheus/media-qoe-alerts.yaml
  - /etc/prometheus/voice-roster-alerts.yaml

scrape_configs:
  - job_name: boohtacord-otel-metrics
    static_configs:
      - targets: ["collector:8889"]
    metric_relabel_configs:
      # target_info contains arbitrary OTLP resource metadata. Consumers use
      # only the bounded service labels explicitly copied by the exporter.
      - source_labels: [__name__]
        regex: "target_info|otel_scope_info"
        action: drop
  - job_name: boohtacord-collector
    static_configs:
      - targets: ["collector:8888"]
  - job_name: boohtacord-tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: boohtacord-prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: boohtacord-livekit
    metrics_path: /metrics
    static_configs:
      - targets: ["livekit:6789"]
    relabel_configs:
      - target_label: instance
        replacement: boohtacord-livekit-sfu
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "livekit_(room_total|participant_total|connection_total|packet_total|packet_bytes|packet_loss_total|packet_loss_percent_(bucket|sum|count)|packet_out_of_order_total|packet_out_of_order_percent_(bucket|sum|count)|jitter_us_(bucket|sum|count)|rtt_ms_(bucket|sum|count))"
        action: keep
      - regex: "node_id|country"
        action: labeldrop
