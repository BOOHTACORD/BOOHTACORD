name: boohtacord-fleet
services:
  registry:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: telemetry_registry
      POSTGRES_USER: telemetry_registry
      POSTGRES_PASSWORD_FILE: /run/secrets/registry_password
    secrets: [registry_password]
    volumes: [registry-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U telemetry_registry -d telemetry_registry"], interval: 5s, timeout: 3s, retries: 20}
    networks: [private]
    mem_limit: 256m
    restart: unless-stopped
  gateway:
    build: {context: ../../.., dockerfile: docker/observability/fleet/Dockerfile}
    environment:
      TELEMETRY_REGISTRY_DATABASE_URL: ${TELEMETRY_REGISTRY_DATABASE_URL:?set private registry DSN}
      TELEMETRY_CREDENTIAL_KEY_FILE: /run/secrets/credential_key
      TELEMETRY_READ_TOKEN_FILE: /run/secrets/read_token
      TELEMETRY_TEMPO_URL: http://tempo:4318
      TELEMETRY_TEMPO_QUERY_URL: http://tempo:3200
      TELEMETRY_METRICS_URL: http://collector:4318
    secrets: [credential_key, read_token]
    ports: ["127.0.0.1:4320:8081"]
    depends_on: {registry: {condition: service_healthy}}
    networks: [private, ingress]
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  tempo:
    image: grafana/tempo:2.10.3
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo/config.yaml:ro", "tempo-data:/var/tempo"]
    networks: [private]
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped
  collector:
    image: otel/opentelemetry-collector:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./collector.yaml:/etc/otelcol/config.yaml:ro"]
    networks: [private]
    mem_limit: 256m
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.11.2
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=2GB"]
    volumes: ["./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro", "./alerts.yaml:/etc/prometheus/alerts.yaml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:4323:9090"]
    networks: [private, ingress]
    mem_limit: 512m
    restart: unless-stopped
secrets:
  registry_password: {file: "${FLEET_REGISTRY_PASSWORD_FILE:?set private secret path}"}
  credential_key: {file: "${FLEET_CREDENTIAL_KEY_FILE:?set private secret path}"}
  read_token: {file: "${FLEET_READ_TOKEN_FILE:?set private secret path}"}
volumes: {registry-data: {}, tempo-data: {}, prometheus-data: {}}
networks: {private: {internal: true}, ingress: {}}
