multitenancy_enabled: true
server: {http_listen_port: 3200}
distributor:
  receivers:
    otlp:
      protocols:
        http: {endpoint: "0.0.0.0:4318"}
ingester: {trace_idle_period: 10s, max_block_duration: 5m}
compactor:
  compaction: {block_retention: 168h}
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
overrides:
  defaults:
    ingestion: {rate_limit_bytes: 1048576, burst_size_bytes: 2097152}
    global: {max_bytes_per_trace: 1048576}
