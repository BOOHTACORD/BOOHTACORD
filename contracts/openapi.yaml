    "securitySchemes": {
      "SessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "vp_session",
        "description": "Opaque server-side session issued by POST /auth/login. Secure; HttpOnly; SameSite=Lax; Path=/. Cookie identifies the caller; every resource still has server-side ACL. Browser clients use credentials, never a bearer token. Logout accepts an absent cookie."
      }
    },
    "headers": {
      "RequestID": {
        "description": "Fresh server-generated UUID for this request. Incoming X-Request-ID is not trusted or echoed. Absent only if request-ID generation fails before dispatch. Error bodies include request_id only where that handler emits it.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
