                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "layer_topology": {
            "enum": [
              "single-layer",
              "bounded-simulcast"
            ]
          },
          "profile_revision": {
            "type": "integer",
            "minimum": 1
          },
