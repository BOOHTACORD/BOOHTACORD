          },
          "reason_codes": {
            "type": "array",
            "uniqueItems": true,
            "maxItems": 8,
            "items": {
              "enum": [
                "user-request",
                "platform-constraint",
                "network-adaptation",
                "no-subscribers",
                "sdk-paused",
                "unsupported-profile",
                "capture-denied",
                "publish-failed",
                "superseded",
                "session-revoked",
                "logout",
                "unknown"
              ]
            }
          }
        },
        "description": "Exact JSON shape accepted by screen-profile handler, bounded to 4096 bytes. Server validates cookie owner, Origin, room, active lease, publication generation and revision. motion is required for _60 profiles; text for _15/_30. simulcast must match more than one layer."
      }
