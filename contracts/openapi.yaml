{
  "openapi": "3.1.1",
  "info": {
    "title": "Voice Platform API",
    "version": "1.0.0-draft",
    "description": "Public HTTP API for one deployment guild. Cookie sessions and server ACL protect resources. Every public POST/PUT/PATCH/DELETE requires the exact configured Origin (CSRF boundary), including anonymous auth operations. WebSocket handshake checks same host when Origin is present. Response X-Request-ID is server generated. Most JSON errors use Error; compact code-only errors, flat client-update errors, empty bodies and text/stream errors are described where emitted. Wrong method/unmatched paths are ServeMux operational responses outside declared operations."
  },
  "paths": {
    "/api/v1/support/consent": {
      "post": {
        "operationId": "acceptProductSupportPublication",
        "parameters": [{"name":"Origin","in":"header","required":true,"schema":{"type":"string"}}],
        "description": "Authenticated same-origin explicit agreement to the current product support notice. Only the caller's consent is recorded. A public repository makes future support text/files public. No ordinary or historical DM is exported. Returns 409 if the notice or product contact changed.",
        "security": [{"SessionCookie": []}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["notice_version"], "properties": {"notice_version": {"type": "integer", "minimum": 1, "maximum": 1000000}}}}}},
        "responses": {
          "204": {"description": "Current notice explicitly accepted; empty body.","headers":{"X-Request-ID":{"$ref":"#/components/headers/RequestID"}}},
          "400": {"description": "Missing, invalid or unknown fields; empty body.","headers":{"X-Request-ID":{"$ref":"#/components/headers/RequestID"}}},
          "401": {"description": "Authentication required.","headers":{"X-Request-ID":{"$ref":"#/components/headers/RequestID"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
          "403": {"description": "Origin rejected.","headers":{"X-Request-ID":{"$ref":"#/components/headers/RequestID"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
          "409": {"description": "Contact or notice changed, or unavailable; empty body.","headers":{"X-Request-ID":{"$ref":"#/components/headers/RequestID"}}},
          "500": {"description": "Session authentication dependency failed; empty body.","headers":{"X-Request-ID":{"$ref":"#/components/headers/RequestID"}}}
        }
      }
    },
    "/api/v1/channels/{channelID}/message-reactions": {
      "get": {
        "operationId": "listTextMessageReactions",
        "description": "Current server-side account/resource ACL. Administrator status grants no DM reading. Explicit PUT/DELETE desired state; no mutation body. Deleted/archived/VOICE scope denied. ID-only realtime hints, metadata cleanup on message deletion.",
        "security": [
          {
            "SessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "channelID",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "message_ids",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 3700
            },
            "description": "Comma-separated1..100 UUIDs. Missing/empty/duplicate query key returns400. No reactor identities are returned."
          }
        ],
        "responses": {
          "400": {
            "description": "Invalid IDs, emoji, cursor, bounds or forbidden mutation body.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Session absent or invalid.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Origin rejected or administrator required.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Unavailable target; same response for foreign DM, blocked, deleted, archived or wrong scope.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Persistence unavailable; middleware failure may emit an empty body.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            },
            "x-empty-body-possible": true
          },
          "200": {
            "description": "Authorized current state.",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              },
              "Cache-Control": {
                "schema": {
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MessageReactionPage"
                }
              }
            }
          }
        }
      }
    },
