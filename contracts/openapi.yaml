                "type": "object",
                "additionalProperties": false,
                "required": [
                  "codec",
                  "layers"
                ],
                "properties": {
                  "codec": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "maxLength": 32
                  },
                  "layers": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 2,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "rid",
                        "width",
                        "height",
                        "max_fps",
                        "max_bitrate_bps",
                        "scale_down_by",
