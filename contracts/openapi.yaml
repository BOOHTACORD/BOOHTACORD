    "/api/v1/archives/text-channels/{channelID}/search": {
      "get": {
        "operationId": "searchArchivedTextHistory",
        "description": "Search one explicit read-only TEXT archive with existing date/author/attachment filters and stable cursor. channel_id if supplied must match path; direct_message_id is forbidden. Active reader required, inaccessible DELETE and VOICE denied. No DM search occurs.",
        "parameters": [
          {
            "name": "channelID",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "query",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          },
          {
            "name": "channel_id",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "direct_message_id",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "author_id",
            "in": "query",
            "description": "Optional author UUID. This does not broaden channel or own-DM access; an author outside the selected readable scope yields no results.",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "has_attachment",
            "in": "query",
            "description": "Optional exact boolean. true requires at least one linked attachment in ATTACHED state; false requires none. Deleted messages remain excluded and file contents are not searched.",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "created_from",
            "in": "query",
            "description": "Optional inclusive message-created instant. RFC3339 with explicit Z or numeric offset and at most six fractional digits. Empty/duplicate/malformed values are invalid.",
            "schema": {
              "type": "string",
              "format": "date-time",
              "maxLength": 32,
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$"
            }
          },
          {
            "name": "created_before",
            "in": "query",
            "description": "Optional exclusive message-created instant. RFC3339 with explicit Z or numeric offset and at most six fractional digits. If created_from is present it must precede created_before; empty/duplicate/malformed values are invalid.",
            "schema": {
              "type": "string",
              "format": "date-time",
              "maxLength": 32,
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$"
            }
          },
          {
            "name": "before",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 512
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          }
        ],
        "security": [
          {
            "SessionCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result",
            "headers": {
              "X-Request-ID": {
                "$ref": "#/components/headers/RequestID"
              }
            },
