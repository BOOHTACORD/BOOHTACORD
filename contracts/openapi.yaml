        "description": "Active ADMINISTRATOR only; existing channel ID/history preserved, expected topology revision and atomic state/audit update. Only explicitly readable archived TEXT may restore. DELETE archives and VOICE denied.",
        "parameters": [
          {
            "name": "channelID",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
